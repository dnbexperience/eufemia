# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: 'npm'
    # Cover the root and every Yarn workspace (see "workspaces" in package.json),
    # so security updates resolve and commit the root yarn.lock alongside the
    # workspace package.json change.
    directories:
      - '/'
      - '/packages/*'
      - '/packages/**/plugins/*'
      - '/tools/*'
    schedule:
      interval: 'monthly'
    # Disable scheduled dependency update PRs (too noisy across the monorepo).
    # Security updates are still opened by Dependabot regardless of this limit.
    open-pull-requests-limit: 0
    # Match Yarn 4 setup (defaultSemverRangePrefix: "" in .yarnrc.yml) by only
    # widening package.json ranges when the new version requires it.
    versioning-strategy: increase-if-necessary
    # Supply-chain guard (DNB "cool-off period"): wait before adopting a freshly
    # published version, so a compromised release isn't picked up immediately.
    # Cooldown applies to version updates ONLY and never delays security updates.
    # Scheduled version updates are disabled above (limit 0), so this block is
    # currently inert; it takes effect only if that limit is later raised.
    cooldown:
      default-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    # Groups apply to scheduled updates (not security updates).
    groups:
      babel:
        patterns:
          - '@babel/*'
          - 'babel-*'
      types:
        patterns:
          - '@types/*'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'jest'
          - 'jest-*'
          - '@testing-library/*'
          - 'playwright'
          - '@playwright/*'
      # Catch-all: batch all remaining dev-dependency minor/patch bumps into a
      # single PR (per directory). Major bumps and production dependencies are
      # still opened individually so they get proper review. Keep this group
      # LAST — a dependency is assigned to the first group it matches.
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    # Supply-chain guard: let a new action release settle before updating to it.
    # Active here (version updates are enabled above), extending GitHub's
    # built-in 3-day version-update cooldown to 7; never delays security updates.
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns:
          - '*'
