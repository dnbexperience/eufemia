name: Eufemia Assets

on:
  pull_request:
    paths:
      - 'packages/dnb-eufemia/assets/**'
      - 'packages/dnb-eufemia/postcss.config.js'
      - 'packages/dnb-eufemia/src/plugins/postcss-font-url-rewrite/**'
      - 'packages/dnb-design-system-portal/postcss.config.js'
      - 'packages/dnb-design-system-portal/src/docs/uilib/typography.mdx'
      - 'tools/assets/**'
      - '.github/workflows/assets.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published Eufemia version, including the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '~> 1.10'

      - name: Lint
        run: yarn workspace eufemia-assets-hosting lint

      - name: Test
        run: yarn workspace eufemia-assets-hosting test

      - name: Validate Terraform
        run: |
          terraform -chdir=tools/assets/infra init -backend=false -input=false
          terraform -chdir=tools/assets/infra validate

  push:
    name: Push to GHE
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout published assets
        id: release-source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.version }}
          path: release-source

      - name: Skip if GHE credentials are missing
        id: gate
        env:
          GHE_PAT: ${{ secrets.GHE_DEPLOY_PAT }}
        run: |
          if [ -z "${GHE_PAT:-}" ]; then
            echo "GHE_DEPLOY_PAT is not set; skipping push."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to GHE deploy repo
        if: steps.gate.outputs.skip != 'true'
        env:
          ASSET_VERSION: ${{ github.event.release.tag_name || inputs.version }}
          GHE_PAT: ${{ secrets.GHE_DEPLOY_PAT }}
          GHE_REPO: ${{ vars.GHE_ASSETS_DEPLOY_REPO }}
          SOURCE_REF: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git -C "$GITHUB_WORKSPACE/release-source" rev-parse HEAD)

          if [[ ! "$GHE_REPO" =~ ^[^/[:space:]]+/[^/[:space:]]+$ ]]; then
            echo "::error::GHE_ASSETS_DEPLOY_REPO must be 'owner/repo' (got ${#GHE_REPO} chars)."
            exit 1
          fi
          case "$GHE_REPO" in
            github_pat_*|ghp_*|gho_*|ghs_*)
              echo "::error::GHE_ASSETS_DEPLOY_REPO looks like a token, not a repo name."
              exit 1 ;;
          esac

          DEPLOY_DIR=$(mktemp -d)
          cd "$DEPLOY_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ ! "$ASSET_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Asset version must be a published semver tag with a v prefix."
            exit 1
          fi

          cp -R "$GITHUB_WORKSPACE/release-source/packages/dnb-eufemia/assets" .
          printf '%s\n' "$ASSET_VERSION" > VERSION
          find assets -type f -print0 | sort -z | xargs -0 sha256sum > ASSETS.sha256
          cp -R "$GITHUB_WORKSPACE/tools/assets/infra" .
          cp "$GITHUB_WORKSPACE/tools/assets/README.md" README.md
          mkdir -p .github/workflows
          cp "$GITHUB_WORKSPACE/tools/assets/ghe-deploy-workflow.yml" .github/workflows/deploy.yml

          git add -A
          git commit -m "Deploy from ${SOURCE_REF} (${SOURCE_SHA:0:7})"

          AUTH_HEADER=$(printf 'x-access-token:%s' "$GHE_PAT" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" \
            push "https://dnb.ghe.com/${GHE_REPO}.git" HEAD:refs/heads/deploy --force
