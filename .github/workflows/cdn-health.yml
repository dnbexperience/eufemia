name: Eufemia CDN health

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Eufemia Assets']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: eufemia-cdn-health
  cancel-in-progress: false

jobs:
  monitor:
    if: >-
      github.repository == 'dnbexperience/eufemia' &&
      ((github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) ||
       (github.event_name == 'workflow_run' &&
        (github.event.workflow_run.event == 'release' || github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            tools/assets
            tools/monitoring

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json

      - name: Check production CDN
        run: node tools/assets/check-cdn.ts

      - name: Store health report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cdn-health-report
          path: cdn-health-report.json
          if-no-files-found: error
          retention-days: 14
