name: Consumer smoke tests

# Build @dnb/eufemia, then production-build minimal Vite and Next.js consumers
# against the packed tarball to catch broken exports, types or CSS imports early.
# release.yml runs the same fixtures as a hard pre-publish gate. This workflow
# needs no secrets, so it runs with least privilege.

on:
  # No `paths:` filter: this gate protects the publishable build, whose inputs
  # span the whole repo (root package.json/yarn.lock, .github/actions/setup and
  # the tools/* packages used by build:ci), so a narrow filter would let a
  # build-breaking change skip the check. Runs on every pull request, plus
  # manual dispatch. Changes to only unit tests or only standalone tools skip
  # the steps below instead (tools/repo-utils/src/detect-changes.mjs): no build
  # reads them.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Build and smoke-test consumers
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Detect changes
        id: changes
        continue-on-error: true
        run: node tools/repo-utils/src/detect-changes.mjs

      - name: Setup dependencies
        if: steps.changes.outputs.packages-unaffected != 'true'
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      # No npm cache for the consumers. A pull request cannot restore another
      # pull request's cache, so each one saved its own copy: on 31 October
      # 2026, 64 copies held 8.6 GiB of the repository's 10 GiB cache. A hit
      # was no faster than a miss (#9269: 1.32 against 1.20 minutes).

      # Full publishable build (also runs the package-content validation gate).
      - name: Build library
        if: steps.changes.outputs.packages-unaffected != 'true'
        run: yarn workspace @dnb/eufemia build:ci

      # Pack the built library ONCE so both consumers install and test the exact
      # same tarball (build once, pack once, test that artifact).
      - name: Pack @dnb/eufemia tarball
        id: pack
        if: steps.changes.outputs.packages-unaffected != 'true'
        run: |
          tarball=$(cd packages/dnb-eufemia/build && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" 2>/dev/null | tail -1)
          echo "tarball=$RUNNER_TEMP/$tarball" >> "$GITHUB_OUTPUT"

      # Both consumers in one step: run-smoke.mjs builds them in parallel. That
      # took 48-66 s, against 39 + 51 s in turn.
      - name: Vite and Next.js consumer smoke tests
        if: steps.changes.outputs.packages-unaffected != 'true'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node smoke/run-smoke.mjs vite nextjs --tarball "$TARBALL"
