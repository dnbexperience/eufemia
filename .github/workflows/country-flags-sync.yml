name: Country Flags

on:
  schedule:
    - cron: '23 6 2 * *'
  workflow_dispatch:

permissions:
  contents: read
  # The open pull request lookup uses the built-in token; everything that
  # writes uses the automation bot token
  pull-requests: read

concurrency:
  group: country-flags-sync
  cancel-in-progress: false

# No job-wide secrets on purpose: they are scoped to the individual steps that
# use them, so `yarn install` and the sync steps never receive credentials.

env:
  BRANCH: flags/automation-flag-icons-sync
  SYNC_PATHS: >-
    yarn.lock
    packages/dnb-eufemia/package.json
    packages/dnb-eufemia/assets/flags
    packages/dnb-eufemia/src/components/country-flag/style/dnb-country-flag-icons.scss

jobs:
  sync-flags:
    name: Sync flags from flag-icons
    if: github.repository == 'dnbexperience/eufemia' && github.ref == 'refs/heads/main'

    runs-on: macos-26

    timeout-minutes: 40

    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
      remote-sha: ${{ steps.branch.outputs.remote_sha }}
      pr-url: ${{ steps.existing-pr.outputs.url }}
      pr-title: ${{ steps.update.outputs.title }}

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Find an open flag update pull request
        id: existing-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json url \
            --jq '.[0].url // empty')
          if [ -n "$url" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "A flag update pull request is already open: $url" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare update branch
        id: branch
        env:
          PR_URL: ${{ steps.existing-pr.outputs.url }}
        run: |
          # The push job makes the automation bot the author
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -n "$PR_URL" ]; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            remote_sha=$(git rev-parse "origin/$BRANCH")
            git switch -c "$BRANCH" "origin/$BRANCH"
            git rebase origin/main
          else
            remote_sha=$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)
            git switch -c "$BRANCH"
          fi
          echo "remote_sha=$remote_sha" >> "$GITHUB_OUTPUT"

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: 'package.json'

      # Not the shared setup action: its node_modules cache would be saved with the updated flag-icons under the old yarn.lock key
      - name: Install dependencies
        run: yarn install --immutable

      - name: Update flag-icons and sync the flags
        env:
          # Yarn makes installs immutable on CI, but this step updates the lockfile
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: |
          # The npmMinimalAgeGate in .yarnrc.yml keeps freshly published versions out
          node -p "'FLAG_ICONS_VERSION=' + require('./packages/dnb-eufemia/package.json').devDependencies['flag-icons']" >> "$GITHUB_ENV"
          yarn up flag-icons --exact
          yarn workspace @dnb/eufemia flags:sync

      - name: Summarize flag changes
        id: update
        run: |
          git add --intent-to-add packages/dnb-eufemia/assets/flags
          yarn workspace @dnb/eufemia exec babel-node --extensions .js,.ts,.tsx ./scripts/tools/prepareCountryFlagUpdate

      - name: Detect flag changes
        id: changes
        run: |
          # shellcheck disable=SC2086 # SYNC_PATHS is a space-separated list
          if [ -z "$(git status --porcelain -- $SYNC_PATHS)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify flag synchronization
        if: steps.changes.outputs.changed == 'true'
        run: yarn workspace @dnb/eufemia test:scripts syncCountryFlags prepareCountryFlagUpdate

      - name: Setup Playwright
        if: steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/setup-playwright
        with:
          browsers: firefox
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Build library and Portal
        if: steps.changes.outputs.changed == 'true'
        run: |
          yarn workspace @dnb/eufemia build:prebuild
          yarn workspace dnb-design-system-portal build:visual-test

      - name: Update CountryFlag and Avatar badge snapshots
        if: steps.changes.outputs.changed == 'true'
        run: >-
          yarn workspace dnb-design-system-portal exec start-server-and-test
          serve http://localhost:8000
          'yarn workspace @dnb/eufemia test:screenshots CountryFlag Avatar --testNamePattern="CountryFlag|country flag as a badge" --update'

      - name: Store visual test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: country-flags-visual-test-artifact
          path: packages/dnb-eufemia/visual-diff-report/**
          if-no-files-found: ignore

      - name: Commit the flag update
        id: commit
        if: success() && steps.changes.outputs.changed == 'true'
        run: |
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2086 # SYNC_PATHS is a space-separated list
          git add $SYNC_PATHS
          git add \
            ':(glob)packages/dnb-eufemia/src/components/country-flag/__tests__/__image_snapshots__/**' \
            ':(glob)packages/dnb-eufemia/src/components/avatar/__tests__/__image_snapshots__/*country-flag-as-a-badge*.png'

          git commit -m "Synchronize country flags from flag-icons"

      - name: Bundle the flag update
        id: bundle
        if: success() && steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/bundle-sync-commits
        with:
          name: flag-update
          base: ${{ steps.commit.outputs.base_sha }}
          files: ${{ runner.temp }}/country-flags-pr.md

      - name: Report no flag changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "The flags are already synchronized with flag-icons."

  # Holds the automation app key, so it runs no code from dependencies: it
  # only checks the commit from the sync job, pushes it and updates the pull
  # request.
  push-flags:
    name: Push the flag update
    needs: sync-flags
    if: needs.sync-flags.outputs.artifact-id != ''

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      # Only the local actions are needed in the working tree; git reads the
      # rest of the history it needs on demand
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
          persist-credentials: false

      # Pushes and pull requests from the bot start the CI workflows, which
      # pushes with the built-in token would not.
      - name: Create automation bot token
        id: automation-bot
        uses: ./.github/actions/automation-token
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Turn the open pull request back into a draft
        if: needs.sync-flags.outputs.pr-url != ''
        env:
          GH_TOKEN: ${{ steps.automation-bot.outputs.token }}
          PR_URL: ${{ needs.sync-flags.outputs.pr-url }}
        run: |
          is_draft=$(gh pr view "$PR_URL" --json isDraft --jq '.isDraft')
          if [ "$is_draft" != true ]; then
            gh pr ready "$PR_URL" --undo
          fi

      - name: Push the flag update
        id: push
        uses: ./.github/actions/push-sync-commits
        with:
          artifact-id: ${{ needs.sync-flags.outputs.artifact-id }}
          branch: ${{ env.BRANCH }}
          remote-sha: ${{ needs.sync-flags.outputs.remote-sha }}
          token: ${{ steps.automation-bot.outputs.token }}
          git-name: ${{ steps.automation-bot.outputs.git-name }}
          git-email: ${{ steps.automation-bot.outputs.git-email }}
          allowed-paths: |
            yarn.lock
            packages/dnb-eufemia/package.json
            packages/dnb-eufemia/assets/flags
            packages/dnb-eufemia/src/components/country-flag/style/dnb-country-flag-icons.scss
            packages/dnb-eufemia/src/components/country-flag/__tests__/__image_snapshots__/**
            packages/dnb-eufemia/src/components/avatar/__tests__/__image_snapshots__/*country-flag-as-a-badge*.png

      - name: Create or update draft pull request
        env:
          GH_TOKEN: ${{ steps.automation-bot.outputs.token }}
          PR_URL: ${{ needs.sync-flags.outputs.pr-url }}
          PR_TITLE: ${{ needs.sync-flags.outputs.pr-title }}
          PR_BODY: ${{ steps.push.outputs.directory }}/country-flags-pr.md
        run: |
          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --title "$PR_TITLE" --body-file "$PR_BODY"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "$PR_TITLE" --body-file "$PR_BODY" --draft
          fi
