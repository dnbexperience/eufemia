name: Detect changes

# Reports what a feature branch or pull request changes since main, so callers
# can skip jobs that the change cannot affect. The path rules live in
# tools/repo-utils/src/detect-changes.mjs.
on:
  workflow_call:
    outputs:
      packages-unaffected:
        description: "'true' when only standalone tools or only unit tests changed, so no package build or E2E/visual test can change."
        value: ${{ jobs.detect.outputs.packages-unaffected }}

permissions:
  contents: read

jobs:
  detect:
    name: Detect changes

    runs-on: ubuntu-latest

    timeout-minutes: 5

    outputs:
      packages-unaffected: ${{ steps.detect.outputs.packages-unaffected }}

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Detect changes
        id: detect
        run: node tools/repo-utils/src/detect-changes.mjs
