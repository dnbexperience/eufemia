name: Dev Preview

on:
  push:
    branches:
      - '**'
      - '!**--skip-ci'
      - '!**--visual-reports'
      - '!wip/**'
      - '!experiments/**'
  pull_request:
    branches:
      - 'portal'
      - 'release'
      - 'beta'
      - 'alpha'
      - 'next'
    types: [opened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# No job-wide `env:` on purpose: the StackBlitz/pkg.pr.new preview publish needs
# no repository secrets, so none are injected (least privilege).

jobs:
  publish:
    name: Publish

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Build
        run: yarn workspace @dnb/eufemia build:ci

      - name: Publish to StackBlitz
        run: yarn workspace eufemia-starter remove-src && yarn dlx pkg-pr-new@0.0.88 publish './packages/dnb-eufemia/build' --template './packages/eufemia-starter' --packageManager=yarn
