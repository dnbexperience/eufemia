name: E2E Tests

on:
  push:
    branches:
      - '**'
      - '!**--skip-ci'
      - '!**--visual-reports'
      - '!wip/**'
      - '!experiments/**'
      - '!release'
      - '!beta'
      - '!alpha'
  # A release pull request runs once, when it is opened. A pull request from a
  # fork has no push run in this repository, so it runs on every update. Any
  # other pull request gets the push run, so here its jobs are skipped under
  # another name: a skipped job counts as success, and must never stand in for
  # the push check of the same name.
  pull_request:
    branches:
      - 'main'
      - 'release'
      - 'beta'
      - 'alpha'
      - 'next'
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # A run whose jobs are all skipped gets a group of its own, so it cannot
  # cancel a release pull request run that is in progress.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ !(github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || (github.event.action == 'opened' && github.base_ref != 'main')) && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # Non-secret build flag only; the public Algolia search config stays scoped
  # to the portal build step (least privilege). Feature branches skip the
  # library build and test source (like visual-regression); main and v* test dist.
  RUN_POST_BUILD: ${{ startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/v') }}

jobs:
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || (github.event.action == 'opened' && github.base_ref != 'main')
    uses: ./.github/workflows/detect-standalone-tools-only.yml

  e2e:
    name: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || (github.event.action == 'opened' && github.base_ref != 'main')) && 'Run e2e tests' || 'Run e2e tests (fork pull requests only)' }}
    needs: changes
    # A skipped job counts as success for the required check; it still runs if detection fails.
    # `!cancelled()` would also run it when `changes` is skipped, so the pull request rule is repeated here.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || (github.event.action == 'opened' && github.base_ref != 'main')) && needs.changes.outputs.standalone-tools-only != 'true' }}

    # Pinned until Playwright can install its system dependencies on Ubuntu 26.04
    runs-on: ubuntu-24.04

    timeout-minutes: 40

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Preview affected E2E tests
        continue-on-error: true
        run: yarn workspace @dnb/eufemia test:e2e:explain
        env:
          E2E_TEST_BASE_REF: origin/${{ github.base_ref || 'main' }}
          E2E_TEST_RUN_ALL: ${{ github.event_name == 'pull_request' }}

      - name: Prepare apt package cache
        run: |
          # Let actions/cache restore into apt's root-owned archive directory
          sudo chown "$(id -un)" /var/cache/apt/archives
          # Expressions can't read runner variables like ImageOS
          echo "IMAGE_OS=$ImageOS" >> "$GITHUB_ENV"

      - name: Use apt package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-${{ env.IMAGE_OS }}-apt-playwright-${{ hashFiles('node_modules/playwright-core/package.json') }}

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browsers: firefox chromium webkit
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Run Portal social image regression tests
        run: yarn workspace dnb-design-system-portal test:og-images

      - name: Prebuild Library
        if: env.RUN_POST_BUILD == 'true'
        run: yarn workspace @dnb/eufemia prebuild:ci

      - name: Postbuild Library
        if: env.RUN_POST_BUILD == 'true'
        run: yarn workspace @dnb/eufemia postbuild:ci

      - name: Build portal
        run: yarn workspace dnb-design-system-portal build:e2e
        env:
          # Public search config embedded into the client bundle at build time.
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_KEY: ${{ secrets.ALGOLIA_SEARCH_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}

      - name: Run Playwright on Portal
        run: yarn workspace dnb-design-system-portal test:e2e:portal:ci

      - name: Run Playwright on Eufemia Components
        run: yarn workspace @dnb/eufemia test:e2e:ci

      - name: Store E2E timings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: e2e-timings
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ./packages/dnb-design-system-portal/test-results/e2e-results.json
            ./packages/dnb-eufemia/test-results/e2e-results.json

      - name: Store Playwright artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-develop-artifact
          path: |
            ./packages/dnb-design-system-portal/test-results
            ./packages/dnb-design-system-portal/playwright-report
            ./packages/dnb-eufemia/test-results
