name: E2E Tests

on:
  push:
    branches:
      - '**'
      - '!**--skip-ci'
      - '!**--visual-reports'
      - '!wip/**'
      - '!experiments/**'
      - '!release'
      - '!beta'
      - '!alpha'
  pull_request:
    branches:
      - 'release'
      - 'beta'
      - 'alpha'
      - 'next'
    types: [opened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Non-secret build flag only; the public Algolia search config stays scoped
  # to the portal build step (least privilege). Feature branches skip the
  # library build and test source (like visual-regression); main and v* test dist.
  RUN_POST_BUILD: ${{ startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/v') }}

jobs:
  changes:
    uses: ./.github/workflows/detect-standalone-tools-only.yml

  e2e:
    name: Run e2e tests
    needs: changes
    # A skipped job counts as success for the required check; it still runs if detection fails.
    if: ${{ !cancelled() && needs.changes.outputs.standalone-tools-only != 'true' }}

    # Pinned until Playwright can install its system dependencies on Ubuntu 26.04
    runs-on: ubuntu-24.04

    timeout-minutes: 40

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Prepare apt package cache
        run: |
          # Let actions/cache restore into apt's root-owned archive directory
          sudo chown "$(id -un)" /var/cache/apt/archives
          # Expressions can't read runner variables like ImageOS
          echo "IMAGE_OS=$ImageOS" >> "$GITHUB_ENV"

      - name: Use apt package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-${{ env.IMAGE_OS }}-apt-playwright-${{ hashFiles('node_modules/playwright-core/package.json') }}

      - name: Use Playwright cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: playwright-cache
        with:
          path: |
            ~/Library/Caches/ms-playwright
            ~/.cache/ms-playwright
            %USERPROFILE%\AppData\Local\ms-playwright
          key: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-playwright-firefox-chromium-webkit-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - name: Install Playwright browsers
        run: yarn workspace dnb-design-system-portal playwright install firefox chromium webkit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright dependencies
        timeout-minutes: 10
        run: |
          if ! timeout 3m yarn workspace dnb-design-system-portal playwright install-deps firefox chromium webkit; then
            # A slow azure.archive.ubuntu.com node never trips apt's stall timeout (actions/runner-images#14823)
            # timeout can't reach the apt-get that sudo started, so stop it unless dpkg is already installing
            pgrep -x dpkg > /dev/null || sudo pkill -x apt-get || true
            while pgrep -x 'apt-get|dpkg' > /dev/null; do sleep 1; done
            sudo dpkg --configure -a
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            yarn workspace dnb-design-system-portal playwright install-deps firefox chromium webkit
          fi

      - name: Prebuild Library
        if: env.RUN_POST_BUILD == 'true'
        run: yarn workspace @dnb/eufemia prebuild:ci

      - name: Postbuild Library
        if: env.RUN_POST_BUILD == 'true'
        run: yarn workspace @dnb/eufemia postbuild:ci

      - name: Build portal
        run: yarn workspace dnb-design-system-portal build:e2e
        env:
          # Public search config embedded into the client bundle at build time.
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_KEY: ${{ secrets.ALGOLIA_SEARCH_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}

      - name: Run Playwright on Portal
        run: yarn workspace dnb-design-system-portal test:e2e:portal:ci

      - name: Run Playwright on Eufemia Components
        run: yarn workspace @dnb/eufemia test:e2e:ci

      - name: Store Playwright artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        # Also after a passing run, so retried (flaky) tests leave their traces
        if: ${{ !cancelled() }}
        with:
          name: playwright-develop-artifact
          path: |
            ./packages/dnb-design-system-portal/test-results
            ./packages/dnb-design-system-portal/playwright-report
            ./packages/dnb-eufemia/test-results
          if-no-files-found: ignore
          retention-days: 14
