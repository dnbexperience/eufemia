name: E2E Tests

on:
  push:
    branches:
      - '**'
      - '!**--skip-ci'
      - '!**--visual-reports'
      - '!wip/**'
      - '!experiments/**'
      - '!release'
      - '!beta'
      - '!alpha'
  pull_request:
    branches:
      - 'release'
      - 'beta'
      - 'alpha'
      - 'next'
    types: [opened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Non-secret build flag only; the public Algolia search config stays scoped
  # to the portal build step (least privilege). Feature branches skip the
  # library build and test source (like visual-regression); main and v* test dist.
  RUN_POST_BUILD: ${{ startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/v') }}

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml

  e2e-job:
    # GitHub appends the matrix values, which also keeps the name readable when the jobs are skipped
    name: Run e2e job
    needs: changes
    # Still runs if detection fails
    if: ${{ !cancelled() && needs.changes.outputs.packages-unaffected != 'true' }}

    # Pinned until Playwright can install its system dependencies on Ubuntu 26.04
    runs-on: ubuntu-24.04

    timeout-minutes: 40

    strategy:
      # Let every job finish, so one run reports all failing tests
      fail-fast: false
      matrix:
        # The runner is CPU-bound with two Playwright workers, so the portal tests are split over two jobs
        include:
          - suite: portal
            shard: 1/2
          - suite: portal
            shard: 2/2
          - suite: components

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Preview affected E2E tests
        if: matrix.suite == 'components'
        continue-on-error: true
        run: yarn workspace @dnb/eufemia test:e2e:explain
        env:
          E2E_TEST_BASE_REF: origin/${{ github.base_ref || 'main' }}
          E2E_TEST_RUN_ALL: ${{ github.event_name == 'pull_request' }}

      - name: Prepare apt package cache
        run: |
          # Let actions/cache restore into apt's root-owned archive directory
          sudo chown "$(id -un)" /var/cache/apt/archives
          # Expressions can't read runner variables like ImageOS
          echo "IMAGE_OS=$ImageOS" >> "$GITHUB_ENV"

      - name: Use apt package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-${{ env.IMAGE_OS }}-apt-playwright-${{ hashFiles('node_modules/playwright-core/package.json') }}

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browsers: firefox chromium webkit
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Run Portal social image regression tests
        if: matrix.suite == 'components'
        run: yarn workspace dnb-design-system-portal test:og-images

      - name: Prebuild Library
        if: env.RUN_POST_BUILD == 'true'
        run: yarn workspace @dnb/eufemia prebuild:ci

      - name: Postbuild Library
        if: env.RUN_POST_BUILD == 'true'
        run: yarn workspace @dnb/eufemia postbuild:ci

      - name: Build portal
        run: yarn workspace dnb-design-system-portal build:e2e
        env:
          # Public search config embedded into the client bundle at build time.
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_KEY: ${{ secrets.ALGOLIA_SEARCH_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}

      - name: Run Playwright on Portal
        if: matrix.suite == 'portal'
        run: yarn workspace dnb-design-system-portal test:e2e:portal:ci
        env:
          E2E_SHARD: ${{ matrix.shard }}

      - name: Run Playwright on Eufemia Components
        if: matrix.suite == 'components'
        run: yarn workspace @dnb/eufemia test:e2e:ci

      - name: Store E2E timings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: e2e-timings-${{ matrix.suite }}-${{ strategy.job-index }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ./packages/dnb-design-system-portal/test-results/e2e-results.json
            ./packages/dnb-eufemia/test-results/e2e-results.json

      - name: Store Playwright artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-develop-artifact-${{ matrix.suite }}-${{ strategy.job-index }}
          path: |
            ./packages/dnb-design-system-portal/test-results
            ./packages/dnb-design-system-portal/playwright-report
            ./packages/dnb-eufemia/test-results

  # Keeps one required check, whatever the number of jobs.
  # Runs on cancellation too, because a skipped required check counts as passed.
  e2e:
    name: Run e2e tests
    needs: [changes, e2e-job]
    if: ${{ always() }}

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      # Jobs skipped after a cancellation must not pass the check
      - name: Fail when canceled
        if: ${{ cancelled() }}
        run: |
          echo 'The workflow was canceled before all e2e tests ran.'
          exit 1

      - name: Check e2e results
        env:
          PACKAGES_UNAFFECTED: ${{ needs.changes.outputs.packages-unaffected }}
          JOB_RESULT: ${{ needs.e2e-job.result }}
        run: |
          if [ "$JOB_RESULT" = 'success' ]; then
            exit 0
          fi

          # Skipped jobs mean that the change cannot affect the e2e tests
          if [ "$JOB_RESULT" = 'skipped' ] && [ "$PACKAGES_UNAFFECTED" = 'true' ]; then
            exit 0
          fi

          echo "E2E tests did not pass (result: $JOB_RESULT)."
          exit 1
