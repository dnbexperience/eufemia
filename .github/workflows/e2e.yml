name: E2E Tests

on:
  push:
    branches:
      - '**'
      - '!**--skip-ci'
      - '!**--visual-reports'
      - '!wip/**'
      - '!experiments/**'
      - '!release'
      - '!beta'
      - '!alpha'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on push, on every fork pull request, and when a same-repo pull
  # request to a release branch is opened. A skipped call reports one "E2E"
  # check, so it can never satisfy the required "E2E / …" checks.
  e2e:
    name: E2E
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      (github.event.action == 'opened' && contains(fromJSON('["release","beta","alpha","next"]'), github.base_ref))
    uses: ./.github/workflows/e2e-jobs.yml
    secrets: inherit
