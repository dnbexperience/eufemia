name: Build Eufemia marketplace artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Build and verify marketplace plugins
        run: yarn workspace eufemia-raiwork-plugin release:check

      - name: Upload RAIWork artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dnb-eufemia-web-${{ github.sha }}
          path: tools/eufemia-raiwork-plugin/dist/dnb-eufemia-web
          if-no-files-found: error
          retention-days: 14

      - name: Upload Agent Plugin artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eufemia-agent-plugin-${{ github.sha }}
          path: tools/eufemia-raiwork-plugin/dist/eufemia
          if-no-files-found: error
          retention-days: 14
