name: Windows font compatibility

on:
  push:
    branches:
      - 'verify/windows-fonts-add130fb--skip-ci'
    paths:
      - '.github/workflows/font-compatibility.yml'
      - 'packages/dnb-eufemia/assets/fonts/**'
      - 'packages/dnb-eufemia/src/style/themes/ui/fonts.scss'
      - 'packages/dnb-eufemia/src/components/skeleton/style/dnb-skeleton.scss'
      - 'packages/dnb-eufemia/src/style/__tests__/Fonts*.spec.ts'
      - 'packages/dnb-eufemia/src/style/__tests__/FontMetrics.e2e.spec.ts'
      - 'packages/dnb-eufemia/src/style/__tests__/FontDiagnostics.e2e.spec.ts'
      - 'packages/dnb-eufemia/playwright.config.font-diagnostics.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fonts:
    name: Check fonts on Windows
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: 'package.json'
          package-manager-cache: false

      - name: Install test dependencies
        run: node .yarn/releases/yarn-4.18.0.cjs install --immutable --mode=skip-build

      - name: Install browsers
        run: node .yarn/releases/yarn-4.18.0.cjs workspace @dnb/eufemia playwright install chromium firefox

      - name: Check font loading, metrics and controls
        run: node .yarn/releases/yarn-4.18.0.cjs workspace @dnb/eufemia playwright test --config playwright.config.e2e.ts src/style/__tests__/Fonts.e2e.spec.ts src/style/__tests__/FontMetrics.e2e.spec.ts --project firefox --project chromium-fonts --workers 2

      - name: Collect diagnostic measurements
        if: ${{ !cancelled() }}
        run: node .yarn/releases/yarn-4.18.0.cjs workspace @dnb/eufemia playwright test --config playwright.config.font-diagnostics.ts

      - name: Save diagnostic evidence
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class FontSystemSettings {
            [DllImport("user32.dll")]
            public static extern uint GetDpiForSystem();
            [DllImport("user32.dll", SetLastError = true)]
            [return: MarshalAs(UnmanagedType.Bool)]
            public static extern bool SystemParametersInfo(uint action, uint param, out uint value, uint flags);
          }
          '@
          [uint32]$smoothing = 0
          [uint32]$smoothingType = 0
          if (-not [FontSystemSettings]::SystemParametersInfo(0x004A, 0, [ref]$smoothing, 0)) {
            throw "Could not read Windows font smoothing"
          }
          if (-not [FontSystemSettings]::SystemParametersInfo(0x200A, 0, [ref]$smoothingType, 0)) {
            throw "Could not read Windows font smoothing type"
          }
          $textSizePath = 'HKCU:\SOFTWARE\Microsoft\Accessibility'
          $textSizePresent = Test-Path $textSizePath
          $textScale = if ($textSizePresent) { (Get-ItemProperty $textSizePath).TextScaleFactor } else { $null }
          [ordered]@{
            systemDpi = [FontSystemSettings]::GetDpiForSystem()
            fontSmoothingEnabled = ($smoothing -ne 0)
            fontSmoothingType = $smoothingType
            textSizeRegistryPresent = $textSizePresent
            textScaleFactorPercent = $textScale
          } | ConvertTo-Json | Set-Content packages/dnb-eufemia/test-results/windows-settings.json

      - name: Upload diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-font-diagnostics
          path: packages/dnb-eufemia/test-results/
          retention-days: 7
