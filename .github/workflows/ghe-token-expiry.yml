name: GHE token expiry

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: >-
      github.repository == 'dnbexperience/eufemia' &&
      (github.event_name == 'schedule' ||
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            tools/monitoring

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json

      - name: Warn before GHE access tokens expire
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON tools/monitoring/alert-token-expiry.ts
        env:
          GHE_DEPLOY_PAT: ${{ secrets.GHE_DEPLOY_PAT }}
          GHE_MONITOR_PAT: ${{ secrets.GHE_MONITOR_PAT }}
          GHE_MONITORING_DEPLOY_PAT: ${{ secrets.GHE_MONITORING_DEPLOY_PAT }}
          TOKEN_EXPIRY_WEBHOOK: ${{ secrets.CDN_ALERT_WEBHOOK }}
