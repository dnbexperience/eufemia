name: Icons Library

on:
  push:
    branches:
      - 'icon*/**'
  workflow_dispatch:

permissions:
  contents: read
  # The open pull request lookup uses the built-in token; everything that
  # writes uses the automation bot token
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# No job-wide `env:` on purpose: secrets are scoped to the individual steps that
# use them, so `yarn install` and the build steps never receive credentials.

jobs:
  process-icons:
    name: Fetch and Build Icons
    if: >-
      github.event_name != 'push' ||
      github.ref_name != 'icons/automation-figma-sync'

    runs-on: macos-26

    timeout-minutes: 60

    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
      remote-sha: ${{ steps.commit.outputs.remote_sha }}

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare manual update branch
        if: github.event_name == 'workflow_dispatch'
        id: manual-branch
        run: |
          branch="icons/automation-figma-sync"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Find an open icon update pull request
        if: github.event_name == 'workflow_dispatch'
        id: existing-pr
        env:
          BRANCH: ${{ steps.manual-branch.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json url \
            --jq '.[0].url // empty')
          if [ -n "$url" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "An icon update pull request is already open: $url" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out the existing icon update branch
        if: steps.existing-pr.outputs.exists == 'true'
        env:
          BRANCH: ${{ steps.manual-branch.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git switch -C "$BRANCH" "origin/$BRANCH"
          git rebase origin/main

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browsers: firefox
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Icons fetch and prebuild
        run: yarn workspace @dnb/eufemia prebuild:figma:ci
        env:
          BRANCH: ${{ steps.manual-branch.outputs.branch || github.ref_name }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_ICONS_FILE: ${{ secrets.FIGMA_ICONS_FILE }}

      - name: Detect icon changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prebuild Library
        if: steps.changes.outputs.changed == 'true'
        run: yarn workspace @dnb/eufemia build:prebuild

      - name: Build portal
        if: steps.changes.outputs.changed == 'true'
        run: yarn workspace dnb-design-system-portal build

      - name: Run visual tests
        if: steps.changes.outputs.changed == 'true'
        run: yarn workspace dnb-design-system-portal test:screenshots:ci:update

      - name: Store visual test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: visual-test-artifact
          path: |
            ./packages/dnb-eufemia/visual-diff-report/**

      - name: Run visual tests info
        if: failure()
        run: echo '\n\n👉 Download the diff files as a ZIP file. \nIt is called "visual-test-artifact" and you find it in the test "Summary" under "Artifacts".\n\n\n'

      - name: Commit the icon update
        id: commit
        if: success() && steps.changes.outputs.changed == 'true'
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            remote_sha=$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)
            if [ "$EXISTING_PR" != true ]; then
              git switch -c "$BRANCH"
            fi
          else
            # The tip this run built on, so a commit pushed during the run makes the push fail
            remote_sha=$(git rev-parse HEAD)
          fi

          # The push job makes the automation bot the author
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/dnb-eufemia/src/icons \
            packages/dnb-eufemia/src/components/icon \
            packages/dnb-eufemia/assets/icons \
            packages/dnb-eufemia/scripts/figma/version.lock

          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git commit --no-verify -m "chore: synchronize icons from Figma"
          echo "remote_sha=$remote_sha" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ steps.manual-branch.outputs.branch || github.ref_name }}
          EXISTING_PR: ${{ steps.existing-pr.outputs.exists }}

      - name: Bundle the icon update
        id: bundle
        if: success() && steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/bundle-sync-commits
        with:
          name: icon-update
          base: ${{ steps.commit.outputs.base_sha }}

      - name: Report no icon changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "Figma and the Eufemia icon library are already synchronized."

  # Holds the automation app key, so it runs no code from dependencies: it
  # only checks the commits from the build job, pushes them and opens the
  # pull request.
  push-icons:
    name: Push the icon update
    needs: process-icons
    if: needs.process-icons.outputs.artifact-id != ''

    runs-on: ubuntu-latest

    timeout-minutes: 15

    # Not taken from the build job, whose outputs are as untrusted as its code
    env:
      BRANCH: ${{ github.event_name == 'workflow_dispatch' && 'icons/automation-figma-sync' || github.ref_name }}

    steps:
      # Only the local actions are needed in the working tree; git reads the
      # rest of the history it needs on demand
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
          persist-credentials: false

      # Pushes and pull requests from the bot start the CI workflows, which
      # pushes with the built-in token would not.
      - name: Create automation bot token
        id: automation-bot
        uses: ./.github/actions/automation-token
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Push the icon update
        uses: ./.github/actions/push-sync-commits
        with:
          artifact-id: ${{ needs.process-icons.outputs.artifact-id }}
          branch: ${{ env.BRANCH }}
          remote-sha: ${{ needs.process-icons.outputs.remote-sha }}
          token: ${{ steps.automation-bot.outputs.token }}
          git-name: ${{ steps.automation-bot.outputs.git-name }}
          git-email: ${{ steps.automation-bot.outputs.git-email }}
          allowed-paths: |
            packages/dnb-eufemia/src/icons
            packages/dnb-eufemia/src/components/icon
            packages/dnb-eufemia/assets/icons
            packages/dnb-eufemia/scripts/figma/version.lock

      - name: Create draft icon update pull request
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.automation-bot.outputs.token }}
        run: |
          PR_URL=$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json url \
            --jq '.[0].url // empty')

          icon_names() {
            git diff --name-only "origin/main...HEAD" --diff-filter="$1" \
              -- 'packages/dnb-eufemia/assets/icons/dnb/*.svg' |
              sed -E 's#.*/##; s/\.svg$//; s/_medium$//' |
              sort -u | paste -sd, - | sed 's/,/, /g'
          }

          added=$(icon_names A)
          removed=$(icon_names D)
          updated=$(icon_names M)
          if git diff --quiet "origin/main...HEAD" -- \
            packages/dnb-eufemia/src/icons/dnb/icons-meta.json; then
            metadata_changed=No
          else
            metadata_changed=Yes
          fi

          if [ -n "$removed" ]; then
            title="feat(Icons)!: remove $removed"
            fallback_title="feat(Icons)!: remove icons from Figma"
          elif [ -n "$added" ]; then
            title="feat(Icons): add $added"
            fallback_title="feat(Icons): add icons from Figma"
          elif [ -n "$updated" ]; then
            title="fix(Icons): update $updated"
            fallback_title="fix(Icons): update icons from Figma"
          else
            title="fix(Icons): synchronize icons from Figma"
            fallback_title="$title"
          fi

          if [ "${#title}" -gt 240 ]; then
            title="$fallback_title"
          fi

          body="Synchronizes the Eufemia icon library with Figma for review before release."
          {
            echo "## Icon changes"
            echo ""
            echo "- Added: ${added:-None}"
            echo "- Updated: ${updated:-None}"
            echo "- Removed: ${removed:-None}"
            echo "- Metadata changed: $metadata_changed"
            echo ""
            echo "Review names, tags, removals, changelog and visual snapshots before marking the pull request ready."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --title "$title"
            is_draft=$(gh pr view "$PR_URL" --json isDraft --jq '.isDraft')
            if [ "$is_draft" != true ]; then
              gh pr ready "$PR_URL" --undo
            fi
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$title" \
              --body "$body" \
              --draft
          fi
