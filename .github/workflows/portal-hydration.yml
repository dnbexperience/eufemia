name: Portal hydration

on:
  schedule:
    - cron: '37 7 * * 2'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/portal-hydration.yml'
      - 'packages/dnb-design-system-portal/scripts/*hydration*'
      - 'packages/dnb-design-system-portal/scripts/__tests__/*hydration*'

permissions:
  contents: read

concurrency:
  group: portal-hydration
  cancel-in-progress: false

jobs:
  scan:
    name: Scan production Portal hydration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Download production sitemap
        id: sitemap
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const response = await fetch('https://eufemia.dnb.no/sitemap.json', {
              signal: AbortSignal.timeout(30000),
            })

            if (response.status === 404) {
              const deployments = await github.paginate(github.rest.repos.listDeployments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: 'github-pages',
                per_page: 100,
              })

              for (const deployment of deployments) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  per_page: 1,
                })
                if (statuses[0]?.state !== 'success') {
                  continue
                }

                core.notice(`Production sitemap is not deployed yet; using documentation from deployment ${deployment.sha}.`)
                core.setOutput('deployment', deployment.sha)
                return
              }

              throw new Error('No successful production deployment found for sitemap generation')
            }

            if (!response.ok) {
              throw new Error(`Could not download production sitemap: ${response.status} ${response.statusText}`)
            }

            const sitemap = await response.json()
            if (!Array.isArray(sitemap.pages) || sitemap.pages.length === 0) {
              throw new Error('The production sitemap must contain a non-empty pages array')
            }

            const fs = require('fs')
            fs.mkdirSync('packages/dnb-design-system-portal/public', { recursive: true })
            fs.writeFileSync(
              'packages/dnb-design-system-portal/public/sitemap.json',
              JSON.stringify(sitemap)
            )

      - name: Check out deployed documentation
        if: steps.sitemap.outputs.deployment != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.sitemap.outputs.deployment }}
          path: portal-deployed-source
          persist-credentials: false

      - name: Generate sitemap before its first production deployment
        if: steps.sitemap.outputs.deployment != ''
        run: |
          cd packages/dnb-design-system-portal
          node vite/prod/generate-accessibility-sitemap.mts \
            ../../portal-deployed-source/packages/dnb-design-system-portal/src/docs

      - name: Install Chromium
        run: yarn workspace dnb-design-system-portal playwright install --with-deps chromium

      - name: Test hydration scanner and reporting
        run: yarn workspace dnb-design-system-portal test:hydration

      - name: Scan all published pages in light and dark mode
        run: yarn workspace dnb-design-system-portal scan:hydration

      - name: Store hydration report and issue previews
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portal-hydration-report
          path: |
            packages/dnb-design-system-portal/portal-hydration-report.json
            packages/dnb-design-system-portal/portal-hydration-issues.json
          if-no-files-found: error
          retention-days: 90

  report:
    name: Update hydration issues
    needs: scan
    if: >-
      github.repository == 'dnbexperience/eufemia' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.PORTAL_HYDRATION_ISSUES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json

      - name: Download this run's report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portal-hydration-report
          path: hydration-report

      - name: Report new findings and recovery
        run: >-
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
          packages/dnb-design-system-portal/scripts/publish-portal-hydration.ts
          --output hydration-report/portal-hydration-report.json
        env:
          GH_TOKEN: ${{ github.token }}
