name: PR Checks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-automation-foundation:
    name: Validate automation foundation

    runs-on: ubuntu-latest

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run automation tests
        run: |
          bash .github/automations/scripts/__tests__/check-mcp-tools.test.sh
          bash .github/automations/scripts/__tests__/report.test.sh
          bash .github/automations/scripts/__tests__/validate-runtime-config.test.sh
          node .github/automations/scripts/__tests__/configuration.test.mjs
          node .github/automations/scripts/__tests__/notification.test.mjs
          node .github/automations/scripts/__tests__/validate-context.test.mjs
          node .github/automations/release/scripts/__tests__/release-utils.test.mjs

  check-pr-title:
    name: Validate PR title

    runs-on: ubuntu-latest

    steps:
      - name: Check PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$PR_TITLE" | grep -qE '^release of '; then
            echo "PR title is a release: $PR_TITLE"
          elif echo "$PR_TITLE" | grep -qE '^(fix|feat|chore|docs|style|design|build|deps|refactor|perf|test)(\(.+\))?!?:'; then
            echo "PR title is valid: $PR_TITLE"
          else
            echo "::error::Invalid PR title: '$PR_TITLE'"
            echo ""
            echo "The PR title must follow Conventional Commits format:"
            echo "  type(optional-scope): description"
            echo ""
            echo "Valid types: fix, feat, chore, docs, style, design, build, deps, refactor, perf, test"
            echo ""
            echo "Examples:"
            echo "  fix: correct button alignment"
            echo "  feat(DatePicker): add new validation mode"
            echo "  feat(Button)!: remove deprecated prop"
            exit 1
          fi
