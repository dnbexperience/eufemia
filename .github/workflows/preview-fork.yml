name: Deploy Fork Preview

# Deploys the portal that "Deploy Preview" built for a pull request from a
# fork. GitHub runs this file from the default branch, with secrets, so it must
# never check out or run the fork's code: the downloaded site is untrusted
# content that is only uploaded.
on:
  workflow_run:
    workflows: [Deploy Preview]
    types: [completed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy fork preview
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Required reviewers approve each deploy; the Cloudflare secrets live here.
    environment: fork-preview

    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write

    steps:
      - name: Find the pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        with:
          script: |
            const { HEAD_SHA, HEAD_REPO } = process.env
            const pulls = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              state: 'open',
              per_page: 100,
            })

            // Only the current head of an open pull request gets deployed.
            const pr = pulls.find(
              (p) => p.head.sha === HEAD_SHA && p.head.repo?.full_name === HEAD_REPO
            )
            if (!pr) {
              core.notice(`No open pull request has head ${HEAD_SHA}; skipping.`)
              return
            }

            core.setOutput('number', String(pr.number))

      # Default branch only (no `ref:`), so the setup action and wrangler are trusted.
      - name: Git checkout
        if: steps.pr.outputs.number
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        if: steps.pr.outputs.number
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Download the built site
        if: steps.pr.outputs.number
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portal-preview
          path: ${{ runner.temp }}/preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # wrangler would deploy _worker.js as server-side code, and the portal
      # ships none of these files.
      - name: Remove Cloudflare Pages config and server code
        if: steps.pr.outputs.number
        working-directory: ${{ runner.temp }}/preview
        run: |
          rm -rf -- _worker.js _routes.json _headers _redirects functions
          find . -type l -delete

      - name: Deploy to Cloudflare Pages
        id: pages_deploy
        if: steps.pr.outputs.number
        run: |
          set -euo pipefail

          OUTPUT="$(yarn workspace dnb-design-system-portal wrangler pages deploy "$RUNNER_TEMP/preview" \
            --project-name eufemia \
            --branch "pr-$PR_NUMBER" \
            --commit-hash "$HEAD_SHA" \
            --commit-message "Fork pull request #$PR_NUMBER" \
            --commit-dirty=true)"

          echo "$OUTPUT"

          ALIAS_URL="$(echo "$OUTPUT" | sed -nE 's/.*Deployment alias URL:\s*(https:\/\/[^ ]+).*/\1/p')"
          DEPLOYMENT_URL="$(echo "$OUTPUT" | sed -nE 's/.*Take a peek over at\s*(https:\/\/[^ ]+).*/\1/p')"

          echo "alias_url=$ALIAS_URL" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Never the fork's branch name: it is untrusted and could match the
          # Pages production branch.
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Post or update preview comment
        if: steps.pr.outputs.number
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ALIAS_URL: ${{ steps.pages_deploy.outputs.alias_url }}
          DEPLOYMENT_URL: ${{ steps.pages_deploy.outputs.deployment_url }}
        with:
          script: |
            const issue_number = Number(process.env.PR_NUMBER)
            const { HEAD_SHA, ALIAS_URL, DEPLOYMENT_URL } = process.env
            const marker = '<!-- pages-preview-comment -->'

            const body = [
              marker,
              '**Branch Preview URL (stable):**',
              ALIAS_URL,
              '',
              '**Deployment URL (unique):**',
              DEPLOYMENT_URL,
              '',
              `Built from the fork commit ${HEAD_SHA}.`,
            ].join('\n')

            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: HEAD_SHA,
              state: 'success',
              context: 'Fork preview',
              target_url: DEPLOYMENT_URL || ALIAS_URL,
              description: 'Portal preview deployed',
            })

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.find((c) => c.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body,
              })
            }
