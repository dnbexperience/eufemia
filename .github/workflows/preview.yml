name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - '**'
      - '!**--skip-ci'
      - '!**--visual-reports'
      - '!wip/**'
      - '!experiments/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# No job-wide `env:` on purpose: the build needs no repository secrets, and the
# Cloudflare credentials are scoped to the deploy step that uses them.

jobs:
  deploy-preview:
    name: Build and deploy (branch preview)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Build
        run: yarn workspace dnb-design-system-portal build
        env:
          VITE_EUFEMIA_STACKBLITZ_VERSION: 'https://pkg.pr.new/@dnb/eufemia@${{ github.event.pull_request.head.sha }}'
          VITE_GITHUB_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          VITE_GITHUB_EDIT_REF: ${{ github.event.pull_request.head.ref }}
          VITE_GITHUB_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}

      # Cloudflare credentials are not exposed to Dependabot-triggered runs or
      # forked PRs. Detect their absence and skip the deploy instead of failing,
      # so those PRs still go green. Only the presence of the token is checked,
      # never its value.
      - name: Skip if Cloudflare credentials are missing
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare credentials are not set; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages (branch preview)
        id: pages_deploy
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail

          OUTPUT="$(yarn workspace dnb-design-system-portal wrangler pages deploy ./public \
            --project-name eufemia \
            --branch "$BRANCH" \
            --commit-dirty=true)"

          echo "$OUTPUT"

          ALIAS_URL="$(echo "$OUTPUT" | sed -nE 's/.*Deployment alias URL:\s*(https:\/\/[^ ]+).*/\1/p')"
          DEPLOYMENT_URL="$(echo "$OUTPUT" | sed -nE 's/.*Take a peek over at\s*(https:\/\/[^ ]+).*/\1/p')"

          echo "alias_url=$ALIAS_URL" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Passed via env (not inlined into the script) so an untrusted PR
          # branch name cannot inject shell commands into the run step.
          BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Post or update preview comment
        if: success() && steps.gate.outputs.skip != 'true' && github.event.pull_request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ALIAS_URL: ${{ steps.pages_deploy.outputs.alias_url }}
          DEPLOYMENT_URL: ${{ steps.pages_deploy.outputs.deployment_url }}
        with:
          script: |
            const aliasUrl = process.env.ALIAS_URL;
            const deploymentUrl = process.env.DEPLOYMENT_URL;
            const marker = "<!-- pages-preview-comment -->";

            const body = [
              marker,
              "**Branch Preview URL (stable):**",
              aliasUrl,
              "",
              "```",
              aliasUrl,
              "```",
              "",
              "**Deployment URL (unique):**",
              deploymentUrl,
              "",
              "```",
              deploymentUrl,
              "```",
              ""
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
