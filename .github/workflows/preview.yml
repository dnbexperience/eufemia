name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - '**'
      - '!**--skip-ci'
      - '!**--visual-reports'
      - '!wip/**'
      - '!experiments/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# No job-wide `env:` on purpose: the build needs no repository secrets, and the
# Cloudflare credentials are scoped to the deploy step that uses them.

jobs:
  deploy-preview:
    name: Build and deploy (branch preview)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      # A step, not a separate job, so other changes don't wait for a second runner.
      - name: Detect changes
        id: changes
        continue-on-error: true
        run: node tools/repo-utils/src/detect-changes.mjs

      - name: Setup dependencies
        if: steps.changes.outputs.packages-unaffected != 'true'
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Restore Portal social images
        if: steps.changes.outputs.packages-unaffected != 'true'
        run: |
          node packages/dnb-design-system-portal/scripts/og-images/cdn.mts --optional
          node packages/dnb-design-system-portal/scripts/og-images/install.mts

      - name: Build
        if: steps.changes.outputs.packages-unaffected != 'true'
        run: yarn workspace dnb-design-system-portal build
        env:
          PORTAL_PUBLIC_ORIGIN: 'https://pr-${{ github.event.pull_request.number }}.eufemia-e25.pages.dev'
          VITE_EUFEMIA_STACKBLITZ_VERSION: 'https://pkg.pr.new/@dnb/eufemia@${{ github.event.pull_request.head.sha }}'
          VITE_GITHUB_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          VITE_GITHUB_EDIT_REF: ${{ github.event.pull_request.head.ref }}
          VITE_GITHUB_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}

      # The gate that keeps broken links out of main. It runs here, on the
      # complete build every PR produces, rather than inside the build script:
      # the other pipelines that build the portal (icons, e2e, visual) have no
      # business failing over a documentation link, and the release must not
      # either. Those decide for themselves by not running this step.
      - name: Validate internal links
        if: steps.changes.outputs.packages-unaffected != 'true'
        run: yarn workspace dnb-design-system-portal validate:links

      # Cloudflare credentials are not exposed to Dependabot-triggered runs or
      # forked PRs. Detect their absence and skip the deploy instead of failing,
      # so those PRs still go green. Only the presence of the token is checked,
      # never its value.
      - name: Skip if Cloudflare credentials are missing
        id: gate
        if: steps.changes.outputs.packages-unaffected != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare credentials are not set; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages (branch preview)
        id: pages_deploy
        if: steps.changes.outputs.packages-unaffected != 'true' && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail

          OUTPUT="$(yarn workspace dnb-design-system-portal wrangler pages deploy ./public \
            --project-name eufemia \
            --branch "$BRANCH" \
            --commit-dirty=true)"

          echo "$OUTPUT"

          DEPLOYMENT_URL="$(echo "$OUTPUT" | sed -nE 's/.*Take a peek over at\s*(https:\/\/[^ ]+).*/\1/p')"

          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # A predictable alias lets social metadata reference this preview.
          BRANCH: pr-${{ github.event.pull_request.number }}

      # Shows the preview in the pull request's Deployments section and timeline.
      - name: Create GitHub deployment
        if: steps.changes.outputs.packages-unaffected != 'true' && steps.gate.outputs.skip != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          # The alias of the `pr-<number>` branch deployed above.
          PREVIEW_URL: 'https://pr-${{ github.event.pull_request.number }}.eufemia-e25.pages.dev'
          DEPLOYMENT_URL: ${{ steps.pages_deploy.outputs.deployment_url }}
        with:
          script: |
            const { owner, repo } = context.repo

            const { data: deployment } = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: context.payload.pull_request.head.sha,
              environment: 'Preview',
              transient_environment: true,
              production_environment: false,
              // Deploy without waiting for the other checks on this commit.
              required_contexts: [],
              auto_merge: false,
            })

            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deployment.id,
              state: 'success',
              environment_url: process.env.PREVIEW_URL,
              log_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              description: process.env.DEPLOYMENT_URL,
              // Keep the previews of other pull requests active.
              auto_inactive: false,
            })

            await core.summary
              .addRaw(`**Branch preview (stable):** ${process.env.PREVIEW_URL}\n\n`)
              .addRaw(`**Deployment (unique):** ${process.env.DEPLOYMENT_URL}\n`)
              .write()
