name: Release

on:
  push:
    branches:
      - 'release'
      - 'portal'
      - 'beta'
      - 'alpha'
      - 'next'
      - '*.x'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # Required for semantic-release to push tags and changelog
  issues: write # Required for semantic-release to comment on issues
  pull-requests: write # Required for semantic-release to comment on PRs
  id-token: write # Required for npm provenance

env:
  GH_EMAIL: ${{ secrets.GH_EMAIL }}
  GH_NAME: ${{ secrets.GH_NAME }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
  FIGMA_ICONS_FILE: ${{ secrets.FIGMA_ICONS_FILE }}
  ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
  ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
  ALGOLIA_SEARCH_KEY: ${{ secrets.ALGOLIA_SEARCH_KEY }}
  ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}

jobs:
  action:
    name: Run release and deploy

    runs-on: ubuntu-latest

    steps:
      - name: Git checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Audit dependencies
        run: yarn workspace @dnb/eufemia audit:ci

      - name: Prebuild Library
        run: yarn workspace @dnb/eufemia prebuild:ci

      - name: Build portal
        if: (github.ref == 'refs/heads/release' ||
          github.ref == 'refs/heads/portal')
        run: yarn workspace dnb-design-system-portal build:ci

      - name: Push Algolia search index
        if: (github.ref == 'refs/heads/release' ||
          github.ref == 'refs/heads/portal')
        run: yarn workspace dnb-design-system-portal build:algolia
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}

      - name: Deploy portal
        if: (github.ref == 'refs/heads/release' ||
          github.ref == 'refs/heads/portal')
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4
        with:
          personal_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./packages/dnb-design-system-portal/public

      - name: Postbuild Library
        run: yarn workspace @dnb/eufemia postbuild:ci

      - name: Release
        if: github.repository == 'dnbexperience/eufemia' &&
          (github.ref == 'refs/heads/release' ||
          github.ref == 'refs/heads/beta' ||
          github.ref == 'refs/heads/alpha' ||
          github.ref == 'refs/heads/next' ||
          endsWith(github.ref, '.x'))
        run: yarn workspace @dnb/eufemia publish:ci

      # Produce the supply-chain compliance artifacts for the published library:
      # a CycloneDX SBOM of its production (shipped) dependencies, plus a
      # vulnerability report. Runs after publish so SBOM tooling can never block
      # a release. Required by DNB (SECARC "Requirements for Application
      # Security": an SBOM accompanied by a vulnerability report per release).
      - name: Generate SBOM and vulnerability report
        if: github.repository == 'dnbexperience/eufemia' &&
          (github.ref == 'refs/heads/release' ||
          github.ref == 'refs/heads/beta' ||
          github.ref == 'refs/heads/alpha' ||
          github.ref == 'refs/heads/next' ||
          endsWith(github.ref, '.x'))
        working-directory: packages/dnb-eufemia
        run: |
          yarn dlx -q @cyclonedx/yarn-plugin-cyclonedx \
            --output-format JSON --spec-version 1.6 \
            --production --output-file sbom.cdx.json
          # Accompanying vulnerability report (production scope). Non-fatal: the
          # "Audit dependencies" step above is the actual release gate.
          yarn npm audit --environment production --json > vulnerability-report.json || true
          [ -s vulnerability-report.json ] || \
            echo '{"summary":"No known vulnerabilities in production dependencies."}' > vulnerability-report.json

      - name: Upload SBOM and vulnerability report
        if: github.repository == 'dnbexperience/eufemia' &&
          (github.ref == 'refs/heads/release' ||
          github.ref == 'refs/heads/beta' ||
          github.ref == 'refs/heads/alpha' ||
          github.ref == 'refs/heads/next' ||
          endsWith(github.ref, '.x'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-and-vulnerability-report
          path: |
            packages/dnb-eufemia/sbom.cdx.json
            packages/dnb-eufemia/vulnerability-report.json
          retention-days: 90
