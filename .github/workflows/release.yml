name: Release

on:
  push:
    branches:
      - 'release'
      - 'beta'
      - 'alpha'
      - 'next'
      - '*.x'

# Releases queue; they are never cancelled mid-flight. semantic-release pushes
# the version tag and the changelog commit BEFORE the publish plugins run (see
# semantic-release's index.js: `tag()` and `push()` precede `plugins.publish()`),
# so a run interrupted in that window leaves the tag in git with nothing on npm.
# The next run then treats that tag as the last release and computes the version
# after it, so the interrupted version is skipped on npm for good and needs
# manual recovery. `cancel-in-progress: true` made an ordinary second push to a
# release branch enough to trigger that, which is why releases wait instead.
#
# Queueing keeps at most one run pending per group (GitHub's default `single`
# behaviour): a newer push supersedes the earlier run while it is still pending,
# which is safe — semantic-release analyses every commit since the last tag, so
# the superseded commits are still released by the run that does start.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# No workflow-wide `env:` on purpose: secrets are scoped to the individual steps
# that need them. The build job has no publish authority; npm OIDC and GitHub
# write permissions exist only in the release job. FIGMA_* is not used by the
# release flow, so it is intentionally not injected anywhere.

jobs:
  build:
    name: Build and validate release

    runs-on: ubuntu-latest

    # Bound how long a release can occupy the concurrency group. Because releases
    # now queue instead of cancelling (see the note above), a stuck run would
    # hold back every later release, and GitHub's default job limit is 6 hours.
    # The whole release job on the previous single-job workflow measured 7-20
    # minutes; this job adds the two consumer smoke builds on top, so 45 minutes
    # is several times the observed cost and only fires on a genuine hang.
    timeout-minutes: 45

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The portal footer falls back to the latest reachable stable tag
          # when a portal-only deployment does not produce an npm version.
          fetch-depth: 0

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}
          # No `registry-url`: it makes actions/setup-node write an .npmrc that
          # conflicts with semantic-release's OIDC auth (EINVALIDNPMTOKEN).
          # semantic-release publishes to the default public registry and
          # handles Trusted Publishing itself.

      - name: Audit dependencies
        run: yarn workspace @dnb/eufemia audit:ci

      - name: Prebuild Library
        run: yarn workspace @dnb/eufemia prebuild:ci

      - name: Build portal
        if: github.ref == 'refs/heads/release'
        run: yarn workspace dnb-design-system-portal build:ci
        env:
          # Public search config embedded into the client bundle at build time.
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_KEY: ${{ secrets.ALGOLIA_SEARCH_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}

      - name: Push Algolia search index
        if: github.ref == 'refs/heads/release'
        run: yarn workspace dnb-design-system-portal build:algolia
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}

      - name: Upload portal artifact
        if: github.ref == 'refs/heads/release'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./packages/dnb-design-system-portal/public

      - name: Postbuild Library
        run: yarn workspace @dnb/eufemia postbuild:ci

      - name: Prepare publishable package
        run: yarn workspace @dnb/eufemia publish:prepare

      # The build info, the `--eufemia-version` custom property and the isolated
      # style scope class all carry the version the prebuild resolved, and a
      # branch name reaching them is what shipped 11.12.0 as "release". This
      # workflow only runs on branches that release, so a build that carries no
      # version must not reach the publish job.
      - name: Verify the release version stamp
        run: |
          node packages/dnb-eufemia/scripts/postbuild/verifyReleaseVersion.mjs \
            packages/dnb-eufemia/build

      # Capture the artifact immediately after validation, before the consumer
      # smoke tests below: those install their fixtures with `npm ci`, which runs
      # dependency lifecycle scripts with write access to build/ (Yarn installs
      # here do not — `enableScripts: false`). Archiving first keeps the package
      # the release job publishes identical to the one `validate:package`
      # checked. tar preserves hidden files and executable modes on the way to
      # the minimal release job.
      - name: Archive prepared release package
        run: |
          tar -czf "$RUNNER_TEMP/prepared-release-package.tar.gz" \
            -C packages/dnb-eufemia build

      - name: Upload prepared release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prepared-release-package
          path: ${{ runner.temp }}/prepared-release-package.tar.gz
          if-no-files-found: error
          retention-days: 1

      # Pack once and run both consumer builds last. A regression fails this job,
      # and the OIDC-enabled release job (`needs: build`) never starts — so the
      # artifact uploaded above is only ever published if these pass.
      - name: Pack @dnb/eufemia for consumer smoke tests
        id: smoke-pack
        run: |
          tarball="$(cd packages/dnb-eufemia/build && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" | tail -1)"
          echo "tarball=$RUNNER_TEMP/$tarball" >> "$GITHUB_OUTPUT"

      - name: Vite consumer smoke test
        run: node smoke/run-smoke.mjs vite --tarball "${{ steps.smoke-pack.outputs.tarball }}"

      - name: Next.js consumer smoke test
        run: node smoke/run-smoke.mjs nextjs --tarball "${{ steps.smoke-pack.outputs.tarball }}"

  action:
    name: Publish release
    needs: build

    runs-on: ubuntu-latest

    # Same reasoning as the build job: keep a stuck publish from holding the
    # release queue for GitHub's default 6 hours. This job only installs the
    # release tooling, restores the validated artifact, runs the guards and
    # publishes, so 30 minutes is generous.
    timeout-minutes: 30

    permissions:
      contents: write # Required for semantic-release to push tags and changelog
      issues: write # Required for semantic-release to comment on issues
      pull-requests: write # Required for semantic-release to comment on PRs
      id-token: write # Required for npm Trusted Publishing (OIDC) and provenance

    outputs:
      released: ${{ steps.release-info.outputs.released }}
      tarball: ${{ steps.pack.outputs.tarball }}

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: 'package.json'
          package-manager-cache: false

      # Only the pinned release tooling runs in this job. Disabling lifecycle
      # scripts prevents dependency install hooks from using its OIDC authority.
      - name: Install release tooling
        run: yarn install --immutable --mode=skip-build

      - name: Download prepared release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prepared-release-package
          path: ${{ runner.temp }}/prepared-release-package

      - name: Restore prepared release package
        run: |
          rm -rf packages/dnb-eufemia/build
          tar -xzf "$RUNNER_TEMP/prepared-release-package/prepared-release-package.tar.gz" \
            -C packages/dnb-eufemia

      # Assert the restored artifact before anything is pointed at it. This is
      # the step that rejects an artifact carrying a `scripts` field, an
      # `.npmrc`, a `node_modules`, a `.git` or a `.env`, and it rewrites the
      # semantic-release config from the trusted checkout so a tampered artifact
      # cannot change how this credentialed job publishes. semantic-release takes
      # the first config it finds, and both a `release` field in package.json and
      # a `.releaserc` outrank the `.releaserc.json` written here, so the step
      # also fails the release if the artifact carries either.
      #
      # It runs before the content validation below on purpose: `npm pack`
      # executes a package's own `prepack` script even under `--dry-run`, so if
      # validation went first, the `--ignore-scripts` flag inside
      # validatePackageContents.mjs would be the only thing standing between a
      # re-added `scripts` entry and code execution in this job. Rejecting the
      # manifest first means that flag is defence in depth rather than the sole
      # control. The reorder is otherwise inert: this step overwrites the
      # `.releaserc.json` prepareForRelease already put on the artifact, so
      # validation still sees the same packed file set.
      - name: Write trusted release config
        run: |
          node packages/dnb-eufemia/scripts/postbuild/writeReleaseConfig.mjs \
            packages/dnb-eufemia/package.json \
            packages/dnb-eufemia/build

      # Re-run the package-content validation here, in the credentialed job,
      # against the restored artifact using the validator from this trusted
      # checkout. The build job already validated the package, but that job is
      # low-privilege and its output is treated as untrusted — re-validating with
      # the trusted deny-list / entry-point / size checks before publishing means
      # a corrupted or tampered artifact is caught in the job that holds the npm
      # and GitHub credentials. Side-effect free (npm pack --dry-run
      # --ignore-scripts); a violation fails the release before anything ships.
      - name: Re-validate restored package contents
        run: yarn workspace @dnb/eufemia validate:package

      # Re-verify the stamp here too, for the same reason the content validation
      # above runs twice: this is the job that holds the npm and GitHub
      # credentials, and the artifact it restored was produced by a job whose
      # output is treated as untrusted. The build job already gated on the stamp,
      # but a corrupted or tampered artifact would otherwise be able to publish a
      # package whose `Eufemia.version`, `--eufemia-version` and style scope class
      # disagree with the release it is published as — which is exactly what
      # shipped in 11.12.0, just by a different route.
      - name: Re-verify the release version stamp
        run: |
          node packages/dnb-eufemia/scripts/postbuild/verifyReleaseVersion.mjs \
            packages/dnb-eufemia/build

      - name: Release
        if: github.repository == 'dnbexperience/eufemia' &&
          (github.ref == 'refs/heads/release' ||
          github.ref == 'refs/heads/beta' ||
          github.ref == 'refs/heads/alpha' ||
          github.ref == 'refs/heads/next' ||
          endsWith(github.ref, '.x'))
        run: yarn workspace @dnb/eufemia publish:release
        env:
          # semantic-release publishes to npm via Trusted Publishing (OIDC): it
          # exchanges this workflow's id-token for a short-lived npm token, so no
          # stored publish secret is needed. Requires a Trusted Publisher for
          # @dnb/eufemia configured on npmjs.com pointing at this workflow.
          # GH_* are for the GitHub release and the changelog/tag commit push.
          GH_EMAIL: ${{ secrets.GH_EMAIL }}
          GH_NAME: ${{ secrets.GH_NAME }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # The prepared build/package.json carries no scripts (prepareForRelease
          # strips them), so this is a no-op in normal operation — but it stops a
          # tampered artifact from running an npm lifecycle hook in this
          # credentialed job.
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'

      # Capture the published version so the least-privilege SBOM job below can
      # target the matching GitHub Release and stamp the SBOM. Empty or the
      # placeholder version means nothing was published.
      - name: Capture released version
        id: release-info
        continue-on-error: true
        if: github.repository == 'dnbexperience/eufemia' &&
          (github.ref == 'refs/heads/release' ||
          github.ref == 'refs/heads/beta' ||
          github.ref == 'refs/heads/alpha' ||
          github.ref == 'refs/heads/next' ||
          endsWith(github.ref, '.x'))
        working-directory: packages/dnb-eufemia
        run: |
          released="$(node -p "require('./build/package.json').version")"
          echo "released=$released" >> "$GITHUB_OUTPUT"

      # Pack the published files into a tarball to serve as the attestation
      # subject. `--ignore-scripts` keeps it side-effect free (no lifecycle
      # scripts run) and uses the same build/ output semantic-release publishes.
      - name: Pack the released library (attestation subject)
        id: pack
        continue-on-error: true
        if: steps.release-info.outputs.released != '' &&
          steps.release-info.outputs.released != '0.0.0-development'
        working-directory: packages/dnb-eufemia
        run: |
          tarball="$(cd build && npm pack --ignore-scripts --pack-destination .. | tail -1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "Packed attestation subject: $tarball"

      # Upload the packed tarball so the separate attestation job can bind the
      # SBOM to it. Short retention: it only needs to outlive this workflow run.
      - name: Upload attestation subject
        continue-on-error: true
        if: steps.pack.outputs.tarball != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-tarball
          path: packages/dnb-eufemia/${{ steps.pack.outputs.tarball }}
          retention-days: 1

  # Generate the CycloneDX SBOM and vulnerability report. This runs untrusted
  # third-party code (the CycloneDX generator via `yarn dlx`), so it lives in
  # its own job with only `contents: read` — none of the release job's OIDC or
  # attestation-writing credentials exist here. Blanking secrets alone would not
  # remove those job credentials, which is why generation is isolated rather than
  # kept inline. Non-blocking (every step is continue-on-error), so a failure
  # here never affects the release. See docs/sbom.md for what these files are,
  # where they are stored, and why.
  sbom:
    name: Generate release SBOM
    needs: action
    if: needs.action.outputs.released != '' &&
      needs.action.outputs.released != '0.0.0-development'

    runs-on: ubuntu-latest

    timeout-minutes: 15

    permissions:
      contents: read

    # This job runs untrusted third-party code (the CycloneDX generator).
    # release.yml has no workflow-level `env:` (secrets are scoped per step — see
    # the note at the top of this file), so no secrets reach this job today;
    # these blanks are defense-in-depth in case a workflow-level `env:` is ever
    # added, so the untrusted code still cannot read them.
    env:
      GH_EMAIL: ''
      GH_NAME: ''
      GH_TOKEN: ''
      FIGMA_TOKEN: ''
      FIGMA_ICONS_FILE: ''
      ALGOLIA_APP_ID: ''
      ALGOLIA_INDEX_NAME: ''
      ALGOLIA_SEARCH_KEY: ''
      ALGOLIA_API_KEY: ''

    steps:
      - name: Git checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        continue-on-error: true
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Generate SBOM and vulnerability report
        continue-on-error: true
        working-directory: packages/dnb-eufemia
        env:
          RELEASED_VERSION: ${{ needs.action.outputs.released }}
        run: |
          # Generated from the source workspace: the CycloneDX plugin needs a
          # Yarn project, and direct runtime deps are identical to the published
          # package. Generator version pinned for reproducibility — bump
          # deliberately and keep it in sync with verify.yml, as yarn dlx is not
          # covered by Dependabot.
          yarn dlx -q @cyclonedx/yarn-plugin-cyclonedx@3.3.3 \
            --output-format JSON --spec-version 1.6 \
            --production --mc-type library --output-file sbom.cdx.json

          # CycloneDX stamps the main component with the manifest's
          # 0.0.0-development placeholder; overwrite it with the version
          # semantic-release actually published.
          node -e '
            const fs = require("fs")
            const released = process.env.RELEASED_VERSION
            const file = "sbom.cdx.json"
            const sbom = JSON.parse(fs.readFileSync(file, "utf8"))
            const component = sbom.metadata && sbom.metadata.component
            if (!component) throw new Error("SBOM is missing metadata.component")
            const placeholder = component.version
            component.version = released
            if (typeof component.purl === "string") {
              component.purl = component.purl.split(placeholder).join(released)
            }
            fs.writeFileSync(file, JSON.stringify(sbom, null, 2) + "\n")
            console.log("SBOM main component version: " + released)
          '

          # Vulnerability report over the same production scope. yarn npm audit
          # emits NDJSON (one advisory per line); normalise it into a single
          # JSON document, capturing the exit status so an audit that could not
          # run is never recorded as a clean result.
          audit_exit=0
          audit_stream="$(yarn npm audit --environment production --recursive --json)" || audit_exit=$?
          printf '%s' "$audit_stream" | node -e '
            const fs = require("fs")
            const exitCode = Number(process.argv[1])
            const raw = fs.readFileSync(0, "utf8")
            const advisories = []
            for (const line of raw.split("\n")) {
              const trimmed = line.trim()
              if (!trimmed) continue
              try {
                advisories.push(JSON.parse(trimmed))
              } catch {
                // Ignore any non-JSON noise Yarn may interleave.
              }
            }
            // Identify the report the way the SBOM identifies itself, so the
            // file stays traceable once downloaded away from its release.
            const meta = {
              component: require("./package.json").name,
              version: process.env.RELEASED_VERSION,
              generatedAt: new Date().toISOString(),
              scope: "production dependencies, including transitive",
              tool: "yarn npm audit",
            }
            let report
            if (exitCode !== 0 && advisories.length === 0) {
              // Non-zero exit and nothing parseable -> the audit could not run
              // (e.g. a registry or network failure). Record the failure
              // instead of a misleading clean result.
              report = {
                ...meta,
                error: "audit could not be completed",
                exitCode,
              }
            } else {
              report = {
                ...meta,
                summary: advisories.length
                  ? advisories.length + " advisory record(s) reported by yarn"
                    + " npm audit. These include deprecation notices as well as"
                    + " security vulnerabilities; check the severity and details"
                    + " of each record."
                  : "No known vulnerabilities in production dependencies.",
                advisories,
              }
            }
            fs.writeFileSync(
              "vulnerability-report.json",
              JSON.stringify(report, null, 2) + "\n"
            )
            console.log(report.error ? report.error : report.summary)
          ' "$audit_exit"

      - name: Upload SBOM and vulnerability report
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-and-vulnerability-report
          path: |
            packages/dnb-eufemia/sbom.cdx.json
            packages/dnb-eufemia/vulnerability-report.json
          retention-days: 90

  # Attest and publish the release SBOM. This job holds the OIDC and
  # attestation-writing credentials but runs only trusted, first-party actions
  # against the artifacts produced above — the untrusted generator never runs
  # here. Non-blocking (every step is continue-on-error).
  attest:
    name: Attest and publish release SBOM
    needs: [action, sbom]

    runs-on: ubuntu-latest

    timeout-minutes: 15

    permissions:
      contents: write # Attach assets to the GitHub Release
      id-token: write # Sign the SBOM attestation
      attestations: write # Record the SBOM attestation

    steps:
      - name: Download attestation subject
        continue-on-error: true
        if: needs.action.outputs.tarball != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: packages/dnb-eufemia

      - name: Download SBOM and vulnerability report
        continue-on-error: true
        if: needs.action.outputs.tarball != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-and-vulnerability-report
          path: packages/dnb-eufemia

      # Sign a CycloneDX SBOM attestation (Sigstore-backed) binding the SBOM to
      # the packed release artifact. Complements npm provenance; verify with
      # `gh attestation verify <tarball> --repo dnbexperience/eufemia`.
      - name: Attest the SBOM
        continue-on-error: true
        if: needs.action.outputs.tarball != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packages/dnb-eufemia/${{ needs.action.outputs.tarball }}
          sbom-path: packages/dnb-eufemia/sbom.cdx.json

      # Attach all three files to the GitHub Release (tag "v<version>") so they
      # persist beyond the 90-day artifact. --clobber keeps re-runs idempotent.
      - name: Attach SBOM and vulnerability report to the GitHub Release
        continue-on-error: true
        if: needs.action.outputs.tarball != ''
        working-directory: packages/dnb-eufemia
        env:
          # gh authenticates with the job's scoped contents:write GITHUB_TOKEN;
          # release.yml has no job-wide env to inherit a token from.
          GH_TOKEN: ${{ github.token }}
          RELEASED_VERSION: ${{ needs.action.outputs.released }}
          PACKED_TARBALL: ${{ needs.action.outputs.tarball }}
        run: |
          gh release upload "v$RELEASED_VERSION" \
            sbom.cdx.json vulnerability-report.json \
            ${PACKED_TARBALL:+"$PACKED_TARBALL"} \
            --clobber --repo "$GITHUB_REPOSITORY"

  deploy-portal:
    name: Deploy portal to GitHub Pages
    needs: action
    if: github.ref == 'refs/heads/release'

    runs-on: ubuntu-latest

    # The workflow-level concurrency group is not released until every job in the
    # run finishes, so this one is bounded too. The deploy itself measured 0.1
    # minutes on the last release; 20 is far above that.
    timeout-minutes: 20

    # Scoped to the minimum the deploy needs (the release job keeps the
    # broader permissions it requires for semantic-release).
    permissions:
      pages: write # Required to deploy to GitHub Pages
      id-token: write # Required for OIDC verification of the deployment

    # Serialize Pages deployments and never cancel one mid-flight, so a
    # deployment is not left half-finished (per actions/deploy-pages guidance).
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy portal
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
