name: Service Monitoring Lambda

on:
  pull_request:
    paths:
      - 'tools/service-monitoring/**'
      - 'tools/assets/check-cdn.ts'
      - 'tools/mcp-lambda/src/check-http.ts'
      - 'tools/monitoring/report-incident.ts'
      - '.github/workflows/service-monitoring.yml'
      - 'yarn.lock'
  push:
    branches: [main]
    paths:
      - 'tools/service-monitoring/**'
      - 'tools/assets/check-cdn.ts'
      - 'tools/mcp-lambda/src/check-http.ts'
      - 'tools/monitoring/report-incident.ts'
      - '.github/workflows/service-monitoring.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Verify monitoring code
        run: |
          yarn workspace eufemia-service-monitoring test:types
          yarn workspace eufemia-service-monitoring lint
          yarn workspace eufemia-service-monitoring test
          yarn workspace eufemia-assets-hosting test
          yarn workspace eufemia-mcp-lambda test src/__tests__/http-health.test.ts
          yarn workspace eufemia-service-monitoring build

      - name: Audit production dependencies
        run: yarn workspace eufemia-service-monitoring audit:ci

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '~> 1.10'

      - name: Validate infrastructure
        run: |
          terraform fmt -check -recursive tools/service-monitoring/infra
          terraform -chdir=tools/service-monitoring/infra init -backend=false -input=false -lockfile=readonly
          terraform -chdir=tools/service-monitoring/infra validate
          terraform -chdir=tools/service-monitoring/infra test

      - name: Store deployment package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: service-monitoring
          path: |
            tools/service-monitoring/dist/lambda.zip
            tools/service-monitoring/infra/*.tf
            tools/service-monitoring/infra/.terraform.lock.hcl
            tools/service-monitoring/ghe-deploy-workflow.yml
            tools/service-monitoring/README.md
          include-hidden-files: true
          retention-days: 14

  deploy-handoff:
    needs: verify-and-build
    if: >-
      github.repository == 'dnbexperience/eufemia' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.GHE_MONITORING_DEPLOY_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get deployment package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: service-monitoring
          path: payload

      - name: Push to internal deployment repository
        env:
          GHE_PAT: ${{ secrets.GHE_DEPLOY_PAT }}
          GHE_REPO: ${{ vars.GHE_MONITORING_DEPLOY_REPO }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${GHE_PAT:-}" || ! "$GHE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo '::error::Configure the monitoring deployment repository and credential.'
            exit 1
          fi
          cd payload
          mkdir -p .github/workflows
          mv ghe-deploy-workflow.yml .github/workflows/deploy.yml
          git init
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Deploy service monitoring from $SOURCE_SHA"
          AUTH_HEADER=$(printf 'x-access-token:%s' "$GHE_PAT" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            push "https://dnb.ghe.com/${GHE_REPO}.git" HEAD:refs/heads/deploy --force
