name: Design Tokens

run-name: Design Tokens → ${{ inputs.output_branch || (github.ref_name != 'main' && github.ref_name) || 'tokens/automation-figma-sync-*' }}

on:
  workflow_dispatch:
    inputs:
      output_branch:
        description: Target branch override (optional)
        type: string
      generate_screenshots:
        description: Generate screenshots
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job-wide secrets on purpose: they are scoped to the individual steps that
# use them, so `yarn install` and the build steps never receive credentials.

env:
  AUTOMATION_BRANCH: tokens/automation-figma-sync

jobs:
  process-tokens:
    name: Fetch and Build Design Tokens

    runs-on: macos-26

    timeout-minutes: 60

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history for the merge-base the pull request body diffs
          # against, without the image snapshot blobs it never reads
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Resolve the design token branch
        id: target
        # Run from main, every run collects its tokens on a dated branch of its
        # own. Run from any other branch, they are committed to that branch.
        # The "output_branch" input overrides both.
        env:
          OUTPUT_BRANCH: ${{ inputs.output_branch }}
          GENERATE_SCREENSHOTS: ${{ inputs.generate_screenshots }}
        run: |
          if [ -n "$OUTPUT_BRANCH" ]; then
            branch=$OUTPUT_BRANCH
          elif [ "$GITHUB_REF_NAME" = main ]; then
            branch=$AUTOMATION_BRANCH-$(date -u +%Y%m%d-%H%M%S)
          else
            branch=$GITHUB_REF_NAME
          fi

          case "$branch" in
            main | release | beta | alpha | next | *.x)
              echo "::error::The design tokens cannot be committed to a branch named \"$branch\". Choose another output branch."
              exit 1
              ;;
          esac

          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          if git rev-parse --verify --quiet "refs/remotes/origin/$branch" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "Attempting to synchronize the design tokens from Figma."
            echo ""
            echo "- Run from: \`$GITHUB_REF_NAME\`"
            echo "- Target branch to commit to: \`$branch\`"
            echo "- Generate screenshots: $GENERATE_SCREENSHOTS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check if branch has PR
        id: existing-pr
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          url=$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json url \
            --jq '.[0].url // empty')
          if [ -n "$url" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "A pull request is already open for the branch: $url" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out the design token branch
        if: steps.target.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh auth setup-git
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git switch -C "$BRANCH" "origin/$BRANCH"

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Use Playwright cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: playwright-cache
        with:
          path: |
            ~/Library/Caches/ms-playwright
            ~/.cache/ms-playwright
            %USERPROFILE%\AppData\Local\ms-playwright
          key: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-playwright-${{ hashFiles('**/yarn.lock') }}
      - name: Install Playwright browsers
        run: yarn workspace @dnb/eufemia playwright install --with-deps firefox
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright dependencies
        run: yarn workspace @dnb/eufemia playwright install-deps firefox
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Design tokens fetch and generate
        run: yarn workspace @dnb/eufemia prebuild:figma:tokens:ci
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_TOKENS_FILE: ${{ vars.FIGMA_TOKENS_FILE }}

      - name: Detect design token changes
        id: changes
        # Scoped to the paths the commit step stages, so an unrelated dirty
        # file cannot start a build that ends with nothing to commit.
        run: |
          if [ -z "$(git status --porcelain -- packages/dnb-eufemia/src/style/themes)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update design token snapshots
        if: steps.changes.outputs.changed == 'true'
        # The snapshots mirror the generated theme files, so a token change always changes them
        run: yarn workspace @dnb/eufemia test:scripts makePropertiesFile -u --hookTimeout=180000

      - name: Prebuild Library
        if: steps.changes.outputs.changed == 'true'
        run: yarn workspace @dnb/eufemia build:prebuild

      - name: Build portal
        if: steps.changes.outputs.changed == 'true'
        run: yarn workspace dnb-design-system-portal build

      - name: Generate screenshots
        if: steps.changes.outputs.changed == 'true' && inputs.generate_screenshots
        run: yarn workspace dnb-design-system-portal test:screenshots:ci:update

      - name: Store visual test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: visual-test-artifact
          path: |
            ./packages/dnb-eufemia/visual-diff-report/**

      - name: Run visual tests info
        if: failure()
        run: echo '\n\n👉 Download the diff files as a ZIP file. \nIt is called "visual-test-artifact" and you find it in the test "Summary" under "Artifacts".\n\n\n'

      - name: Commit design tokens and updated snapshots
        id: commit
        if: success() && steps.changes.outputs.changed == 'true'
        run: |
          gh auth setup-git
          # The tip fetched at the start, so a commit pushed during the run makes the push fail instead of vanishing
          remote_sha=$(git rev-parse --verify --quiet "refs/remotes/origin/$BRANCH" || true)

          if [ "$BRANCH_EXISTS" != true ]; then
            git switch -c "$BRANCH"
            echo "branch_created=true" >> "$GITHUB_OUTPUT"
          fi
          git config user.name "$GH_NAME"
          git config user.email "$GH_EMAIL"
          git add \
            packages/dnb-eufemia/src/style/themes \
            packages/dnb-eufemia/scripts/prebuild/tasks/__tests__/__snapshots__/makePropertiesFile.test.ts.snap

          git commit --no-verify -m "chore: synchronize design tokens from Figma"

          # Kept apart from the token change, so the screenshot noise can be
          # reviewed, or dropped, on its own
          git add ':(glob)packages/dnb-eufemia/src/**/__image_snapshots__/**'

          if ! git diff --cached --quiet; then
            git commit --no-verify -m "chore: update screenshots for the new design tokens"
            echo "commits=2" >> "$GITHUB_OUTPUT"
          else
            echo "commits=1" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$remote_sha" ]; then
            git push origin "HEAD:refs/heads/$BRANCH" \
              --force-with-lease="refs/heads/$BRANCH:$remote_sha"
          else
            git push --set-upstream origin "$BRANCH"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_NAME: ${{ secrets.GH_NAME }}
          GH_EMAIL: ${{ secrets.GH_EMAIL }}
          BRANCH_EXISTS: ${{ steps.target.outputs.exists }}

      - name: Create or comment on the design token pull request
        if: success() && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EXISTING_PR: ${{ steps.existing-pr.outputs.exists }}
          PR_URL: ${{ steps.existing-pr.outputs.url }}
          BRANCH_CREATED: ${{ steps.commit.outputs.branch_created }}
          COMMITS: ${{ steps.commit.outputs.commits }}
        run: |
          token_scss='packages/dnb-eufemia/src/style/themes/*/tokens*.scss'
          foundation_scss='packages/dnb-eufemia/src/style/themes/*/foundation.scss'

          # Declarations on the added (+) or removed (-) side of the diff
          token_names() {
            git diff -U0 "origin/main...HEAD" -- "$token_scss" |
              sed -n "s/^$1[[:space:]]*\(--token-[a-z0-9-]*\):.*/\1/p" |
              sort -u
          }

          as_list() {
            if [ -z "$1" ]; then
              echo "None"
            else
              echo "$1" | paste -sd, - | sed 's/,/, /g'
            fi
          }

          added=$(comm -23 <(token_names '+') <(token_names '-'))
          removed=$(comm -13 <(token_names '+') <(token_names '-'))
          themes=$(git diff --name-only "origin/main...HEAD" \
            -- "$token_scss" "$foundation_scss" |
            cut -d/ -f6 |
            sed 's/^ui$/DNB/; s/^sbanken$/Sbanken/; s/^carnegie$/Carnegie/' |
            sort -u | paste -sd, - | sed 's/,/, /g')

          if [ -n "$themes" ]; then
            subject="design tokens for $themes"
          else
            subject="design tokens from Figma"
          fi

          if [ -n "$removed" ]; then
            title="feat(Theme)!: remove $subject"
          elif [ -n "$added" ]; then
            title="feat(Theme): add $subject"
          else
            title="fix(Theme): update $subject"
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [ "$EXISTING_PR" = true ]; then
            intro="Updated design tokens from Figma."
            footer="This comment was generated by the [Design tokens git action]($run_url)."
          else
            intro="Synchronizes the Eufemia design tokens with Figma for review before release."
            footer="This PR was generated by the [Design tokens git action]($run_url)."
          fi

          body=$(
            echo "$intro"
            echo ""
            echo "- Themes: ${themes:-None}"
            echo "- Added: $(as_list "$added")"
            echo "- Removed: $(as_list "$removed")"
            echo ""
            if [ "$EXISTING_PR" = true ]; then
              echo "Suggested title: \`$title\`"
              echo ""
            fi
            echo "Review the token values, removals, snapshots, and visual screenshots before marking the pull request ready."
            echo "---"
            echo "$footer"
          )

          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"

          # An open pull request is left alone, so the run reports itself in a
          # comment instead of rewriting someone else's description
          if [ "$EXISTING_PR" = true ]; then
            gh pr comment "$PR_URL" --body "$body"
            pr_url=$PR_URL
            pr_title=$(gh pr view "$PR_URL" --json title --jq '.title')
            pr_action="Commented on PR"
          else
            pr_url=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$title" \
              --body "$body" \
              --draft)
            pr_title=$title
            pr_action="Created PR"
          fi

          if [ "$BRANCH_CREATED" = true ]; then
            branch_action="Created branch"
          else
            branch_action="Updated branch"
          fi

          {
            echo ""
            echo "# Summary:"
            echo ""
            echo "- $branch_action: [$BRANCH]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$BRANCH) with $COMMITS commit(s)"
            echo "- $pr_action: [$pr_title]($pr_url)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report no design token changes
        if: steps.changes.outputs.changed == 'false'
        # If there is nothing to commit, the run stays green, but has to
        #say so in the Actions list and the summary.
        env:
          BRANCH_EXISTS: ${{ steps.target.outputs.exists }}
          BRANCH_CREATED: ${{ steps.commit.outputs.branch_created }}
        run: |
          if [ "$BRANCH_EXISTS" = true ]; then
            synced_branch=$BRANCH
          else
            synced_branch=$GITHUB_REF_NAME
          fi

          message="Design tokens are already synchronized with Figma on branch \`$synced_branch\`. Nothing was committed to \`$BRANCH\`."

          if [ "$BRANCH_EXISTS" != true ] && [ "$BRANCH_CREATED" != true ]; then
            message="$message Branch \`$BRANCH\` was not created."
          fi

          echo "::warning::$message"
          {
            echo "# Summary:"
            echo ""
            echo "⚠️ $message"
          } >> "$GITHUB_STEP_SUMMARY"
