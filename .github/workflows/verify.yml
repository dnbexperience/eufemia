name: Verify

on:
  push:
    branches:
      - '**'
      - '!**--skip-ci'
      - '!**--visual-reports'
      - '!wip/**'
      - '!experiments/**'
  # Fork branches never trigger `push` here. Same-repo pull requests skip the
  # call below, because their push already ran it.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A skipped call reports one "Verify" check, so it can never satisfy the
  # required "Verify / …" checks on a same-repo pull request.
  verify:
    name: Verify
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/verify-jobs.yml
    secrets:
      CACHE_VERSION: ${{ secrets.CACHE_VERSION }}
