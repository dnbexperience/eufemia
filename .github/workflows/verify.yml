name: Verify

on:
  push:
    branches:
      - '**'
      - '!**--skip-ci'
      - '!**--visual-reports'
      - '!wip/**'
      - '!experiments/**'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job-wide `env:` on purpose: these jobs only install, lint, type-check,
# test and build — none need repository secrets (least privilege).

jobs:
  setup:
    name: Install dependencies

    runs-on: ubuntu-latest

    timeout-minutes: 10

    outputs:
      standalone-tools-only: ${{ steps.changes.outputs.standalone-tools-only }}
      affected-workspaces: ${{ steps.changes.outputs.affected-workspaces }}

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Detect changes
        id: changes
        continue-on-error: true
        run: node tools/repo-utils/src/detect-changes.mjs

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

  lint:
    name: Run lint
    needs: setup

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      # Persist ESLint's --cache between runs so unchanged files are skipped.
      # The key is unique per commit (always a miss), so restore-keys pulls
      # the most recent prior cache and ESLint only re-lints what changed; a
      # fresh entry is then saved at the end of the job.
      # ESLint does not see a change to a local rule, or an upgrade of a plugin
      # without version metadata (such as eslint-plugin-react), as a config
      # change, so their hash starts a fresh cache when they change.
      # ESLint re-lints a file only when that file or the config changes, so
      # other files that a rule reads must be part of the hash too:
      # - docs-types/sync-docs-jsdoc checks a component against its sibling
      #   *Docs files. Without them, a change to only a *Docs file does not
      #   re-check its component. The patterns mirror the rule
      #   (`Docs\.[jt]sx?$`), as hashFiles does not support {a,b} braces.
      # - compat/compat reads the browser targets from .browserslistrc.
      # - import-x/named, import-x/default and import-x/no-named-as-default read
      #   the module that a file imports. They only read .js, .mjs and .cjs
      #   modules (the default `import-x/extensions`), so those files are in
      #   the hash.
      - name: Use ESLint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/dnb-eufemia/.eslintcache
          key: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-eslint-eufemia-${{ hashFiles('yarn.lock', 'packages/dnb-eufemia/scripts/**/*.js', 'packages/dnb-eufemia/scripts/**/*.[cm]js', 'packages/dnb-eufemia/src/**/*.js', 'packages/dnb-eufemia/src/**/*.[cm]js', 'packages/dnb-eufemia/src/**/*Docs.[jt]s', 'packages/dnb-eufemia/src/**/*Docs.[jt]sx', 'packages/dnb-eufemia/.browserslistrc') }}-${{ github.sha }}
          restore-keys: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-eslint-eufemia-${{ hashFiles('yarn.lock', 'packages/dnb-eufemia/scripts/**/*.js', 'packages/dnb-eufemia/scripts/**/*.[cm]js', 'packages/dnb-eufemia/src/**/*.js', 'packages/dnb-eufemia/src/**/*.[cm]js', 'packages/dnb-eufemia/src/**/*Docs.[jt]s', 'packages/dnb-eufemia/src/**/*Docs.[jt]sx', 'packages/dnb-eufemia/.browserslistrc') }}-

      - name: Run lint
        # Every workspace with a lint script is listed here, except the Portal
        # which has its own job below — keep this list complete when adding one.
        env:
          AFFECTED_WORKSPACES: ${{ needs.setup.outputs.affected-workspaces || 'all' }}
        run: |
          tools/repo-utils/src/run-if-affected.sh @dnb/eufemia lint:ci
          # Checks every workflow file, so it also runs when the library is skipped
          yarn workspace @dnb/eufemia lint:workflows
          tools/repo-utils/src/run-if-affected.sh @dnb/eufemia-mcp-legacy-proxy lint
          tools/repo-utils/src/run-if-affected.sh eufemia-mcp-lambda lint
          tools/repo-utils/src/run-if-affected.sh eufemia-usage-ingest lint
          tools/repo-utils/src/run-if-affected.sh eufemia-raiwork-plugin lint
          tools/repo-utils/src/run-if-affected.sh eufemia-analytics lint
          tools/repo-utils/src/run-if-affected.sh eufemia-analytics-dashboard lint
          tools/repo-utils/src/run-if-affected.sh eufemia-assets-hosting lint
          tools/repo-utils/src/run-if-affected.sh eufemia-css-optimizer lint
          tools/repo-utils/src/run-if-affected.sh eufemia-llm-metadata lint
          tools/repo-utils/src/run-if-affected.sh markdown-tables-utils lint
          tools/repo-utils/src/run-if-affected.sh react-live-ssr-adapter lint
          tools/repo-utils/src/run-if-affected.sh eufemia-starter lint

  lint-portal:
    name: Run portal lint
    needs: setup
    if: needs.setup.outputs.standalone-tools-only != 'true'

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      # Same as the library cache above: ESLint does not see an upgrade of a
      # plugin without version metadata (eslint-plugin-react and
      # eslint-plugin-workspaces here) as a config change. The portal config
      # extends the library config, so the local rules are in the hash too,
      # even though no portal file uses them today.
      - name: Use ESLint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/dnb-design-system-portal/.eslintcache
          key: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-eslint-portal-${{ hashFiles('yarn.lock', 'packages/dnb-eufemia/scripts/eslint/**/*.js') }}-${{ github.sha }}
          restore-keys: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-eslint-portal-${{ hashFiles('yarn.lock', 'packages/dnb-eufemia/scripts/eslint/**/*.js') }}-

      - name: Run lint
        run: yarn workspace dnb-design-system-portal lint:ci

  typecheck:
    name: Run type checks
    needs: setup

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      # Persist TypeScript's incremental build info so unchanged files are
      # skipped on type-check. Unique key per commit + restore-keys pulls the
      # latest prior build info; tsc re-checks only what changed (and falls
      # back to a full check if the cache is missing or stale).
      - name: Use TypeScript build-info cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            packages/dnb-eufemia/tsconfig.tsbuildinfo
            packages/dnb-design-system-portal/tsconfig.tsbuildinfo
            tools/eufemia-llm-metadata/tsconfig.tsbuildinfo
          key: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-tsbuildinfo-${{ github.sha }}
          restore-keys: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-tsbuildinfo-

      - name: Run type checks
        # Every workspace with a type-check script is listed here — keep this
        # list complete when adding one.
        env:
          AFFECTED_WORKSPACES: ${{ needs.setup.outputs.affected-workspaces || 'all' }}
        run: |
          tools/repo-utils/src/run-if-affected.sh @dnb/eufemia test:types
          tools/repo-utils/src/run-if-affected.sh @dnb/eufemia test:types:definitions
          tools/repo-utils/src/run-if-affected.sh dnb-design-system-portal test:types
          tools/repo-utils/src/run-if-affected.sh react-live-ssr-adapter test:types
          tools/repo-utils/src/run-if-affected.sh eufemia-css-optimizer test:types
          tools/repo-utils/src/run-if-affected.sh eufemia-llm-metadata test:types
          tools/repo-utils/src/run-if-affected.sh eufemia-raiwork-plugin test:types
          tools/repo-utils/src/run-if-affected.sh @dnb/eufemia-mcp-legacy-proxy typecheck
          tools/repo-utils/src/run-if-affected.sh eufemia-mcp-lambda typecheck
          tools/repo-utils/src/run-if-affected.sh eufemia-usage-ingest typecheck
          tools/repo-utils/src/run-if-affected.sh eufemia-analytics test:types
          tools/repo-utils/src/run-if-affected.sh eufemia-analytics-dashboard test:types

  test:
    name: Run tests
    needs: setup

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Vitest's `--changed` diffs the branch against its merge-base with
          # main, which needs full commit history. `blob:none` keeps that fast:
          # file contents are fetched on demand, and `git diff --name-only`
          # only needs commit and tree objects, not blobs.
          fetch-depth: 0
          filter: blob:none

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Run tests
        # Every workspace with unit tests is listed here — keep this list
        # complete when adding one. No other workflow runs them on a pull
        # request, so a workspace missing from this list has its tests first
        # execute at release or deploy time.
        #
        # dnb-eufemia runs only the unit tests affected by the branch's changes
        # (full suite on protected branches, or when shared test infra changes).
        env:
          UNIT_TEST_BASE_REF: origin/main
          AFFECTED_WORKSPACES: ${{ needs.setup.outputs.affected-workspaces || 'all' }}
        run: |
          tools/repo-utils/src/run-if-affected.sh @dnb/eufemia test:ci:changed
          tools/repo-utils/src/run-if-affected.sh dnb-design-system-portal test:ci
          tools/repo-utils/src/run-if-affected.sh react-live-ssr-adapter test
          tools/repo-utils/src/run-if-affected.sh eufemia-css-optimizer test
          tools/repo-utils/src/run-if-affected.sh markdown-tables-utils test
          tools/repo-utils/src/run-if-affected.sh eufemia-llm-metadata test
          tools/repo-utils/src/run-if-affected.sh eufemia-raiwork-plugin test
          tools/repo-utils/src/run-if-affected.sh @dnb/eufemia-mcp-legacy-proxy test
          tools/repo-utils/src/run-if-affected.sh eufemia-mcp-lambda test
          tools/repo-utils/src/run-if-affected.sh eufemia-analytics test
          tools/repo-utils/src/run-if-affected.sh eufemia-analytics-dashboard test
          tools/repo-utils/src/run-if-affected.sh eufemia-assets-hosting test
          tools/repo-utils/src/run-if-affected.sh repo-utils test:ci

  deps:
    name: Run dependency checks
    needs: setup
    if: needs.setup.outputs.standalone-tools-only != 'true'

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Run dependency checks
        run: yarn workspace @dnb/eufemia test:deps

  build-check:
    name: Run build tests

    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Git checkout (with fetch-depth)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Change detection diffs against main, and "postbuild:ci" (getCommittedFiles)
          # reads recent commits. Both need commit history but no blobs.
          fetch-depth: 0
          filter: blob:none

      # A step, not a separate job, so other changes don't wait for a second runner.
      - name: Detect changes
        id: changes
        continue-on-error: true
        run: node tools/repo-utils/src/detect-changes.mjs

      - name: Setup dependencies
        if: steps.changes.outputs.tests-only != 'true'
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Verify isCI
        if: steps.changes.outputs.tests-only != 'true'
        run: yarn workspace repo-utils test:ci

      - name: Prebuild Library
        if: steps.changes.outputs.packages-unaffected != 'true'
        run: yarn workspace @dnb/eufemia prebuild:ci

      - name: Postbuild Library
        if: steps.changes.outputs.packages-unaffected != 'true'
        run: yarn workspace @dnb/eufemia postbuild:ci

      - name: Build marketplace plugins
        if: steps.changes.outputs.tests-only != 'true'
        run: yarn workspace eufemia-raiwork-plugin build:all

      # The starter is published as a consumer template (see dev.yml) and has
      # no other CI coverage.
      - name: Build starter template
        if: steps.changes.outputs.packages-unaffected != 'true'
        run: yarn workspace eufemia-starter build

      - name: Check bundle sizes
        if: steps.changes.outputs.packages-unaffected != 'true'
        env:
          BUNDLEWATCH_GITHUB_TOKEN: ${{ github.token }}
        run: yarn workspace @dnb/eufemia build:size
