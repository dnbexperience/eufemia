name: Verify

on:
  push:
    branches:
      - '**'
      - '!**--skip-ci'
      - '!**--visual-reports'
      - '!wip/**'
      - '!experiments/**'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job-wide `env:` on purpose: these jobs only install, lint, type-check,
# test and build — none need repository secrets (least privilege).

jobs:
  setup:
    name: Install dependencies

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

  lint:
    name: Run lint
    needs: setup

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      # Persist ESLint's --cache between runs so unchanged files are skipped.
      # The key is unique per commit (always a miss), so restore-keys pulls
      # the most recent prior cache and ESLint only re-lints what changed; a
      # fresh entry is then saved at the end of the job.
      # ESLint does not see a change to a local rule, or an upgrade of a plugin
      # without version metadata (such as eslint-plugin-react), as a config
      # change, so their hash starts a fresh cache when they change.
      # ESLint re-lints a file only when that file or the config changes, so
      # other files that a rule reads must be part of the hash too:
      # - docs-types/sync-docs-jsdoc checks a component against its sibling
      #   *Docs files. Without them, a change to only a *Docs file does not
      #   re-check its component. The patterns mirror the rule
      #   (`Docs\.[jt]sx?$`), as hashFiles does not support {a,b} braces.
      # - compat/compat reads the browser targets from .browserslistrc.
      # - import/named, import/default and import/no-named-as-default read the
      #   module that a file imports. With no TypeScript resolver, they only
      #   resolve .js, .mjs and .cjs files, so those files are in the hash.
      - name: Use ESLint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/dnb-eufemia/.eslintcache
          key: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-eslint-eufemia-${{ hashFiles('yarn.lock', 'packages/dnb-eufemia/scripts/**/*.js', 'packages/dnb-eufemia/scripts/**/*.[cm]js', 'packages/dnb-eufemia/src/**/*.js', 'packages/dnb-eufemia/src/**/*.[cm]js', 'packages/dnb-eufemia/src/**/*Docs.[jt]s', 'packages/dnb-eufemia/src/**/*Docs.[jt]sx', 'packages/dnb-eufemia/.browserslistrc') }}-${{ github.sha }}
          restore-keys: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-eslint-eufemia-${{ hashFiles('yarn.lock', 'packages/dnb-eufemia/scripts/**/*.js', 'packages/dnb-eufemia/scripts/**/*.[cm]js', 'packages/dnb-eufemia/src/**/*.js', 'packages/dnb-eufemia/src/**/*.[cm]js', 'packages/dnb-eufemia/src/**/*Docs.[jt]s', 'packages/dnb-eufemia/src/**/*Docs.[jt]sx', 'packages/dnb-eufemia/.browserslistrc') }}-

      - name: Run lint
        # Every workspace with a lint script runs here, except the Portal which
        # has its own job below — keep this list complete when adding one.
        run: |
          yarn workspace @dnb/eufemia lint:ci
          yarn workspace @dnb/eufemia-mcp-legacy-proxy lint
          yarn workspace eufemia-mcp-lambda lint
          yarn workspace eufemia-mcp-usage-record lint
          yarn workspace eufemia-raiwork-plugin lint
          yarn workspace eufemia-analytics lint
          yarn workspace eufemia-analytics-dashboard lint
          yarn workspace eufemia-assets-hosting lint
          yarn workspace eufemia-css-optimizer lint
          yarn workspace eufemia-llm-metadata lint
          yarn workspace markdown-tables-utils lint
          yarn workspace react-live-ssr-adapter lint
          yarn workspace eufemia-starter lint

  lint-portal:
    name: Run portal lint
    needs: setup

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      # Same as the library cache above: ESLint does not see an upgrade of a
      # plugin without version metadata (eslint-plugin-react, -import and
      # -workspaces here) as a config change. The portal config extends the
      # library config, so the local rules are in the hash too, even though no
      # portal file uses them today.
      - name: Use ESLint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/dnb-design-system-portal/.eslintcache
          key: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-eslint-portal-${{ hashFiles('yarn.lock', 'packages/dnb-eufemia/scripts/eslint/**/*.js') }}-${{ github.sha }}
          restore-keys: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-eslint-portal-${{ hashFiles('yarn.lock', 'packages/dnb-eufemia/scripts/eslint/**/*.js') }}-

      - name: Run lint
        run: yarn workspace dnb-design-system-portal lint:ci

  typecheck:
    name: Run type checks
    needs: setup

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      # Persist TypeScript's incremental build info so unchanged files are
      # skipped on type-check. Unique key per commit + restore-keys pulls the
      # latest prior build info; tsc re-checks only what changed (and falls
      # back to a full check if the cache is missing or stale).
      - name: Use TypeScript build-info cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            packages/dnb-eufemia/tsconfig.tsbuildinfo
            packages/dnb-design-system-portal/tsconfig.tsbuildinfo
            tools/eufemia-llm-metadata/tsconfig.tsbuildinfo
          key: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-tsbuildinfo-${{ github.sha }}
          restore-keys: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-tsbuildinfo-

      - name: Run type checks
        # Every workspace with a type-check script runs here — keep this list
        # complete when adding one.
        run: |
          yarn workspace @dnb/eufemia test:types
          yarn workspace @dnb/eufemia test:types:definitions
          yarn workspace dnb-design-system-portal test:types
          yarn workspace react-live-ssr-adapter test:types
          yarn workspace eufemia-css-optimizer test:types
          yarn workspace eufemia-llm-metadata test:types
          yarn workspace eufemia-raiwork-plugin test:types
          yarn workspace @dnb/eufemia-mcp-legacy-proxy typecheck
          yarn workspace eufemia-mcp-lambda typecheck
          yarn workspace eufemia-mcp-usage-record typecheck
          yarn workspace eufemia-analytics test:types
          yarn workspace eufemia-analytics-dashboard test:types

  test:
    name: Run tests
    needs: setup

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Vitest's `--changed` diffs the branch against its merge-base with
          # main, which needs full commit history. `blob:none` keeps that fast:
          # file contents are fetched on demand, and `git diff --name-only`
          # only needs commit and tree objects, not blobs.
          fetch-depth: 0
          filter: blob:none

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Run tests
        # Every workspace with unit tests runs here — keep this list complete
        # when adding one. No other workflow runs them on a pull request, so a
        # workspace missing from this list has its tests first execute at
        # release or deploy time.
        #
        # dnb-eufemia runs only the unit tests affected by the branch's changes
        # (full suite on protected branches, or when shared test infra changes).
        env:
          UNIT_TEST_BASE_REF: origin/main
        run: |
          yarn workspace @dnb/eufemia test:ci:changed
          yarn workspace dnb-design-system-portal test:ci
          yarn workspace react-live-ssr-adapter test
          yarn workspace eufemia-css-optimizer test
          yarn workspace markdown-tables-utils test
          yarn workspace eufemia-llm-metadata test
          yarn workspace eufemia-raiwork-plugin test
          yarn workspace @dnb/eufemia-mcp-legacy-proxy test
          yarn workspace eufemia-mcp-lambda test
          yarn workspace eufemia-analytics test
          yarn workspace eufemia-analytics-dashboard test
          yarn workspace eufemia-assets-hosting test
          yarn workspace repo-utils test:ci

  deps:
    name: Run dependency checks
    needs: setup

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Run dependency checks
        run: yarn workspace @dnb/eufemia test:deps

  build-check:
    name: Run build tests

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      statuses: write

    steps:
      - name: Git checkout (with fetch-depth)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 20 # The "postbuild:ci" method "getCommittedFiles" needs all history

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Verify isCI
        run: yarn workspace repo-utils test:ci

      - name: Prebuild Library
        run: yarn workspace @dnb/eufemia prebuild:ci

      - name: Postbuild Library
        run: yarn workspace @dnb/eufemia postbuild:ci

      - name: Build marketplace plugins
        run: yarn workspace eufemia-raiwork-plugin build:all

      # The starter is published as a consumer template (see dev.yml) and has
      # no other CI coverage.
      - name: Build starter template
        run: yarn workspace eufemia-starter build

      - name: Check bundle sizes
        env:
          BUNDLEWATCH_GITHUB_TOKEN: ${{ github.token }}
        run: yarn workspace @dnb/eufemia build:size
