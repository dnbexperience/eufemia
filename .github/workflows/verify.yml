name: Verify

on:
  push:
    branches:
      - '**'
      - '!**--skip-ci'
      - '!**--visual-reports'
      - '!wip/**'
      - '!experiments/**'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job-wide `env:` on purpose: these jobs only install, audit, lint,
# type-check, test and build — none need repository secrets (least privilege).

jobs:
  setup:
    name: Install dependencies

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

  audit:
    name: Audit dependencies
    needs: setup

    runs-on: ubuntu-latest

    timeout-minutes: 10

    # This job runs untrusted third-party code (the CycloneDX generator via
    # `yarn dlx` in the SBOM smoke test below). verify.yml has no workflow-level
    # `env:` (see the note at the top of this file), so no secrets reach this job
    # today; these blanks are defense-in-depth in case a workflow-level `env:` is
    # ever added, so the untrusted code still cannot read them.
    env:
      GH_EMAIL: ''
      GH_NAME: ''
      GH_TOKEN: ''
      FIGMA_TOKEN: ''
      FIGMA_ICONS_FILE: ''

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Check lockfile is deduplicated
        # Guards against a plain `yarn install` reintroducing duplicate (and
        # potentially vulnerable) transitive versions. Run `yarn dedupe` locally
        # and commit yarn.lock if this fails.
        run: yarn dedupe --check

      - name: Audit dependencies
        # Audit the shipped (production) dependency tree of everything we ship:
        # the @dnb/eufemia npm library, the @dnb/eufemia-mcp Lambda and the
        # eufemia-analytics Lambda. All must pass; dev/build tooling advisories
        # are tracked via Dependabot instead.
        run: |
          run_audit() {
            local output
            local status

            for attempt in 1 2 3; do
              set +e
              output="$("$@" 2>&1)"
              status=$?
              set -e

              printf '%s\n' "$output"

              if [ "$status" -eq 0 ]; then
                return 0
              fi

              if [[ "$output" != *"RequestError: Timeout awaiting 'socket'"* ]] ||
                [ "$attempt" -eq 3 ]; then
                return "$status"
              fi

              echo "::warning::Audit registry timed out; retrying in 10 seconds"
              sleep 10
            done
          }

          run_audit yarn workspace @dnb/eufemia audit:ci
          run_audit yarn workspace @dnb/eufemia-mcp audit:ci
          run_audit yarn workspace eufemia-analytics audit:ci

      - name: Verify SBOM + audit generation (release smoke test)
        # release.yml generates a CycloneDX SBOM and a vulnerability report after
        # every publish — but that workflow only runs on release branches, so PR
        # CI never exercises it. Run the two external generators here so a broken
        # plugin, a changed flag, or an altered `yarn npm audit --json` output
        # shape is caught on the PR instead of mid-release. Keep the pinned
        # generator version below in sync with release.yml. The release-only
        # version stamp and GitHub-Release upload are not exercised here.
        working-directory: packages/dnb-eufemia
        # The generator runs third-party code fetched via `yarn dlx` and needs no
        # credentials of its own; the job-level `env:` above defensively blanks
        # secrets, so none can reach it.
        run: |
          # Pinned version MUST match the one in release.yml.
          yarn dlx -q @cyclonedx/yarn-plugin-cyclonedx@3.3.3 \
            --output-format JSON --spec-version 1.6 \
            --production --mc-type library --output-file sbom.cdx.json

          # Assert the SBOM has the shape release consumers expect.
          node -e '
            const sbom = require("./sbom.cdx.json")
            if (sbom.bomFormat !== "CycloneDX" || sbom.specVersion !== "1.6") {
              throw new Error(
                "unexpected SBOM format: " + sbom.bomFormat + " " + sbom.specVersion
              )
            }
            if (!(sbom.metadata && sbom.metadata.component)) {
              throw new Error("SBOM is missing metadata.component")
            }
            const count = (sbom.components || []).length
            if (count === 0) throw new Error("SBOM lists no components")
            console.log("SBOM OK: CycloneDX 1.6, " + count + " production components")
          '

          # Assert `yarn npm audit --json` still emits parseable per-line JSON
          # (the NDJSON shape release.yml relies on). Non-gating: audit:ci above
          # is the real gate, so a non-zero exit (advisories present) is fine
          # here as long as every line parses.
          audit_exit=0
          audit_stream="$(yarn npm audit --environment production --recursive --json)" || audit_exit=$?
          printf '%s' "$audit_stream" | node -e '
            const fs = require("fs")
            let records = 0
            for (const line of fs.readFileSync(0, "utf8").split("\n")) {
              const trimmed = line.trim()
              if (!trimmed) continue
              JSON.parse(trimmed) // throws if the NDJSON assumption breaks
              records++
            }
            console.log("audit --json parsed: " + records + " record(s), exit " + process.argv[1])
          ' "$audit_exit"

          # Generated file is gitignored; remove it so the tree stays clean.
          rm -f sbom.cdx.json

  lint:
    name: Run lint
    needs: setup

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      # Persist ESLint's --cache between runs so unchanged files are skipped.
      # The key is unique per commit (always a miss), so restore-keys pulls
      # the most recent prior cache and ESLint only re-lints what changed; a
      # fresh entry is then saved at the end of the job.
      - name: Use ESLint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/dnb-eufemia/.eslintcache
          key: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-eslint-eufemia-${{ github.sha }}
          restore-keys: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-eslint-eufemia-

      - name: Run lint
        run: |
          yarn workspace @dnb/eufemia lint:ci
          yarn workspace @dnb/eufemia-mcp-legacy-proxy lint
          yarn workspace eufemia-raiwork-plugin lint
          yarn workspace eufemia-analytics lint

  lint-portal:
    name: Run portal lint
    needs: setup

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Use ESLint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/dnb-design-system-portal/.eslintcache
          key: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-eslint-portal-${{ github.sha }}
          restore-keys: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-eslint-portal-

      - name: Run lint
        run: yarn workspace dnb-design-system-portal lint:ci

  typecheck:
    name: Run type checks
    needs: setup

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      # Persist TypeScript's incremental build info so unchanged files are
      # skipped on type-check. Unique key per commit + restore-keys pulls the
      # latest prior build info; tsc re-checks only what changed (and falls
      # back to a full check if the cache is missing or stale).
      - name: Use TypeScript build-info cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            packages/dnb-eufemia/tsconfig.tsbuildinfo
            packages/dnb-design-system-portal/tsconfig.tsbuildinfo
            tools/eufemia-llm-metadata/tsconfig.tsbuildinfo
          key: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-tsbuildinfo-${{ github.sha }}
          restore-keys: ${{ secrets.CACHE_VERSION }}-${{ runner.os }}-tsbuildinfo-

      - name: Run type checks
        run: |
          yarn workspace @dnb/eufemia test:types
          yarn workspace dnb-design-system-portal test:types
          yarn workspace eufemia-css-optimizer test:types
          yarn workspace eufemia-llm-metadata test:types
          yarn workspace eufemia-raiwork-plugin test:types
          yarn workspace @dnb/eufemia-mcp-legacy-proxy typecheck
          yarn workspace eufemia-analytics test:types

  test:
    name: Run tests
    needs: setup

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Vitest's `--changed` diffs the branch against its merge-base with
          # main, which needs full commit history. `blob:none` keeps that fast:
          # file contents are fetched on demand, and `git diff --name-only`
          # only needs commit and tree objects, not blobs.
          fetch-depth: 0
          filter: blob:none

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Run tests
        # dnb-eufemia runs only the unit tests affected by the branch's changes
        # (full suite on protected branches, or when shared test infra changes).
        env:
          UNIT_TEST_BASE_REF: origin/main
        run: |
          yarn workspace @dnb/eufemia test:ci:changed
          yarn workspace dnb-design-system-portal test:ci
          yarn workspace eufemia-css-optimizer test
          yarn workspace markdown-tables-utils test
          yarn workspace eufemia-llm-metadata test
          yarn workspace eufemia-raiwork-plugin test
          yarn workspace @dnb/eufemia-mcp-legacy-proxy test
          yarn workspace eufemia-analytics test

  deps:
    name: Run dependency checks
    needs: setup

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Run dependency checks
        run: yarn workspace @dnb/eufemia test:deps

  build-check:
    name: Run build tests

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      statuses: write

    steps:
      - name: Git checkout (with fetch-depth)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 20 # The "postbuild:ci" method "getCommittedFiles" needs all history

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Verify isCI
        run: yarn workspace repo-utils test:ci

      - name: Prebuild Library
        run: yarn workspace @dnb/eufemia prebuild:ci

      - name: Postbuild Library
        run: yarn workspace @dnb/eufemia postbuild:ci

      - name: Build marketplace plugins
        run: yarn workspace eufemia-raiwork-plugin build:all

      - name: Check bundle sizes
        env:
          BUNDLEWATCH_GITHUB_TOKEN: ${{ github.token }}
        run: yarn workspace @dnb/eufemia build:size
