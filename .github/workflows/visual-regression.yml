name: Visual Regression Tests

on:
  push:
    branches:
      - '**'
      - '!**--skip-ci'
      - '!**--visual-reports'
      - '!wip/**'
      - '!experiments/**'
      - '!release'
      - '!beta'
      - '!alpha'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Runs on push, on every fork pull request, and when a same-repo pull
  # request to a release branch is opened.
  visual-regression:
    name: Visual
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      (github.event.action == 'opened' && contains(fromJSON('["release","beta","alpha","next"]'), github.base_ref))
    uses: ./.github/workflows/visual-regression-jobs.yml
    secrets:
      CACHE_VERSION: ${{ secrets.CACHE_VERSION }}
      ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
      ALGOLIA_SEARCH_KEY: ${{ secrets.ALGOLIA_SEARCH_KEY }}
      ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
