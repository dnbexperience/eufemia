name: Visual Regression Tests

on:
  push:
    branches:
      - '**'
      - '!**--skip-ci'
      - '!**--visual-reports'
      - '!wip/**'
      - '!experiments/**'
      - '!release'
      - '!beta'
      - '!alpha'
  # A release pull request runs once, when it is opened. A pull request from a
  # fork has no push run in this repository, so it runs on every update. Any
  # other pull request gets the push run, so here its jobs are skipped under
  # another name: a skipped job counts as success, and must never stand in for
  # the push check of the same name.
  pull_request:
    branches:
      - 'main'
      - 'release'
      - 'beta'
      - 'alpha'
      - 'next'
    types: [opened, synchronize, reopened]

concurrency:
  # A run whose jobs are all skipped gets a group of its own, so it cannot
  # cancel a release pull request run that is in progress.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ !(github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || (github.event.action == 'opened' && github.base_ref != 'main')) && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # Only non-secret build flags remain here; the public Algolia config is
  # scoped to the build step. actions/github-script receives the token
  # automatically — no env var needed.
  RUN_POST_BUILD: ${{ startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/v') }}
  RUN_VISUAL_TEST: ${{ !startsWith(github.ref, 'refs/heads/icon') }}
  PLAYWRIGHT_SCREENSHOT_WORKERS: 100%

jobs:
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || (github.event.action == 'opened' && github.base_ref != 'main')
    uses: ./.github/workflows/detect-standalone-tools-only.yml

  visual-regression:
    name: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || (github.event.action == 'opened' && github.base_ref != 'main')) && 'Run visual-regression tests' || 'Run visual-regression tests (fork pull requests only)' }}
    needs: changes
    # A skipped job counts as success for the required check; it still runs if detection fails.
    # `!cancelled()` would also run it when `changes` is skipped, so the pull request rule is repeated here.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || (github.event.action == 'opened' && github.base_ref != 'main')) && needs.changes.outputs.standalone-tools-only != 'true' }}

    runs-on: macos-26

    timeout-minutes: 60

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Resolve changed files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // Without a complete file list, run all screenshot tests rather than none
            const runAll = (message) => {
              core.warning(`${message} Running all screenshot tests.`)
              core.exportVariable('VISUAL_TEST_RUN_ALL', 'true')
            }

            // GitHub lists at most 3000 files of a pull request and 300 of a comparison
            let fileLimit = 0
            let files = []

            if (context.eventName === 'pull_request') {
              const pullNumber = context.payload.pull_request?.number

              if (!pullNumber) {
                return runAll('No pull request number found.')
              }

              fileLimit = 3000
              files = await github.paginate(
                github.rest.pulls.listFiles,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber,
                  per_page: 100,
                }
              )
            } else if (context.eventName === 'push') {
              const head = context.payload.after || context.sha
              const defaultBranch =
                context.payload.repository?.default_branch || 'main'

              if (!head) {
                return runAll('Missing push head SHA.')
              }

              fileLimit = 300
              try {
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  basehead: `${defaultBranch}...${head}`,
                })

                files = comparison.data.files || []
              } catch {
                const base = context.payload.before

                if (!base) {
                  return runAll('Missing push base SHA.')
                }

                const comparison = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base,
                  head,
                })

                files = comparison.data.files || []
              }
            } else {
              return runAll(`Unsupported event: ${context.eventName}.`)
            }

            if (files.length >= fileLimit) {
              return runAll(`GitHub listed ${files.length} changed files, so the list may be truncated.`)
            }

            // A renamed file also affects the tests of the directory it was moved from
            const changedFiles = files
              .flatMap((file) => [file.filename, file.previous_filename])
              .filter(Boolean)

            core.exportVariable(
              'VISUAL_TEST_CHANGED_FILES',
              changedFiles.join('\n')
            )

      # Skips the build and the test run when no screenshot test can be affected
      - name: Plan visual tests
        id: plan
        if: env.RUN_VISUAL_TEST == 'true'
        run: yarn workspace @dnb/eufemia test:screenshots:ci:conditional --plan

      - name: Setup Playwright
        if: steps.plan.outputs.skip != 'true'
        uses: ./.github/actions/setup-playwright
        with:
          browsers: firefox
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Prebuild Library
        if: env.RUN_POST_BUILD == 'true'
        run: yarn workspace @dnb/eufemia prebuild:ci

      - name: Postbuild Library
        if: env.RUN_POST_BUILD == 'true'
        run: yarn workspace @dnb/eufemia postbuild:ci

      - name: Build portal
        if: env.RUN_VISUAL_TEST == 'true' && steps.plan.outputs.skip != 'true'
        run: yarn workspace dnb-design-system-portal build:visual-test
        env:
          # Public search config embedded into the client bundle at build time.
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_KEY: ${{ secrets.ALGOLIA_SEARCH_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}

      - name: Run visual tests
        if: env.RUN_VISUAL_TEST == 'true' && steps.plan.outputs.skip != 'true'
        run: |
          (
            while sleep 60; do
              ps -axo rss,comm | awk '
                /Nightly.app/ { firefox += $1 }
                /node$/ { node += $1 }
                END { printf "Memory: Firefox %.0f MiB, Node %.0f MiB\n", firefox / 1024, node / 1024 }
              '
              sysctl vm.swapusage
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          yarn workspace dnb-design-system-portal test:screenshots:ci:conditional

      - name: Store visual test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: visual-test-artifact
          path: |
            ./packages/dnb-eufemia/visual-diff-report/**

      # The visual diff report is a self-contained folder (index.html +
      # images/). Only proceed when it actually exists (a non-screenshot
      # failure produces none), and detect whether Cloudflare credentials are
      # available so the deploy is skipped gracefully on forked PRs (no
      # secrets) or when the token is not configured. The secret comparison
      # yields only a boolean; the secret value itself is never emitted.
      - name: Detect report hosting capability
        id: report_host
        if: failure()
        run: |
          if [ -f packages/dnb-eufemia/visual-diff-report/report.json ]; then
            echo "has_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_report=false" >> "$GITHUB_OUTPUT"
          fi
          echo "enabled=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy visual report to Cloudflare Pages
        id: report_deploy
        if: failure() && steps.report_host.outputs.has_report == 'true' && steps.report_host.outputs.enabled == 'true'
        # Best-effort: a hosting hiccup must not add a red step to a run that
        # already failed on the real visual regression.
        continue-on-error: true
        run: |
          set -euo pipefail

          # Extract the deployment URL from wrangler's stdout. Uses POSIX
          # [[:space:]] (not \s) because this job runs on macOS, whose BSD sed
          # does not support \s.
          OUTPUT="$(yarn workspace dnb-design-system-portal wrangler pages deploy \
            "$GITHUB_WORKSPACE/packages/dnb-eufemia/visual-diff-report" \
            --project-name eufemia \
            --branch "vr-$BRANCH" \
            --commit-dirty=true)"

          echo "$OUTPUT"

          ALIAS_URL="$(echo "$OUTPUT" | sed -nE 's/.*Deployment alias URL:[[:space:]]*(https:\/\/[^ ]+).*/\1/p')"
          DEPLOYMENT_URL="$(echo "$OUTPUT" | sed -nE 's/.*Take a peek over at[[:space:]]*(https:\/\/[^ ]+).*/\1/p')"

          # Prefer the immutable per-deployment URL so each run's summary keeps
          # pointing at its own report; the branch alias always moves to the
          # latest deploy. Fall back to the alias if the unique URL is absent.
          echo "report_url=${DEPLOYMENT_URL:-$ALIAS_URL}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Passed via env (not inlined into the script) so an untrusted PR
          # branch name cannot inject shell commands into the run step.
          BRANCH: ${{ github.head_ref || github.ref_name }}

      # Render the failed screenshots directly on the run's Summary page. When
      # the report was hosted, each row embeds a diff thumbnail linking to the
      # full-size image; otherwise the list still points to the artifact. The
      # Markdown is built by a small, unit-tested Node module.
      - name: Publish visual report to job summary
        if: failure() && steps.report_host.outputs.has_report == 'true'
        # Best-effort: rendering the summary must not add a red step to an
        # already-failed run.
        continue-on-error: true
        env:
          REPORT_URL: ${{ steps.report_deploy.outputs.report_url }}
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types \
            packages/dnb-eufemia/scripts/tools/visualReport/summaryCli.ts \
            packages/dnb-eufemia/visual-diff-report/report.json >> "$GITHUB_STEP_SUMMARY"

      # Print clickable links in the failing job's log so you can jump
      # straight to the hosted report (or the run summary) without hunting.
      # GitHub linkifies bare URLs in step logs.
      - name: Run visual tests info
        if: failure() && steps.report_host.outputs.has_report == 'true'
        env:
          REPORT_URL: ${{ steps.report_deploy.outputs.report_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo '👉 Visual regression failed — where to see why:'
          if [ -n "${REPORT_URL}" ]; then
            echo "   • Hosted report (before / after / diff): ${REPORT_URL}"
          fi
          echo "   • Run summary (failed-test table + artifact): ${RUN_URL}"
          echo "   • Offline: download the 'visual-test-artifact' ZIP from the run summary."
