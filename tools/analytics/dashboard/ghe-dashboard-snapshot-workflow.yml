# Fetches an analytics snapshot and prepares it for the dashboard.
#
# Runs in the GitHub Enterprise repo, where the analytics bearer token is
# available as a secret. The request goes through the Akamai edge, which adds
# the origin header, so only the bearer token is needed here. The token never
# reaches the browser: this job bakes the response into a static file that the
# dashboard reads.
#
# The publish step depends on where the dashboard is hosted and is enabled once
# that target exists (see dashboard/README.md).

name: Analytics dashboard snapshot

on:
  schedule:
    # Hourly, on the hour.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ANALYTICS_URL: ${{ vars.ANALYTICS_URL || 'https://server.eufemia.dnb.no/analytics' }}

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fetch snapshot
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${API_TOKEN}" ]; then
            echo "API_TOKEN is not set; cannot fetch snapshot." >&2
            exit 1
          fi

          curl -fsS \
            -H "Authorization: Bearer ${API_TOKEN}" \
            "${ANALYTICS_URL}/records?limit=1000" \
            -o raw.json

          # Fail early if the response is not the expected envelope.
          jq -e 'has("records") and (.records | type == "array")' raw.json > /dev/null

          jq --arg ts "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            '{generatedAt: $ts, records: .records}' raw.json \
            > tools/analytics/dashboard/data/records.json

          COUNT=$(jq '.records | length' tools/analytics/dashboard/data/records.json)
          echo "## Snapshot ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Records:** ${COUNT}" >> "$GITHUB_STEP_SUMMARY"

      # Publish the static dashboard (index.html, styles.css, app.js and
      # data/records.json) to the chosen host. Enable once hosting is decided:
      #
      #   - name: Configure AWS credentials
      #     uses: aws-actions/configure-aws-credentials@<pinned-sha>
      #     with:
      #       role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      #       aws-region: eu-north-1
      #
      #   - name: Publish to S3
      #     run: aws s3 sync tools/analytics/dashboard "s3://${{ vars.DASHBOARD_BUCKET }}" --delete
