name: Deploy Eufemia Assets

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '~> 1.10'

      - name: Deploy infrastructure
        env:
          TF_VAR_cost_allocation: ${{ vars.COST_ALLOCATION }}
          TF_VAR_edge_auth_secret: ${{ secrets.EDGE_AUTH_SECRET }}
        run: |
          set -euo pipefail
          terraform -chdir=infra init -input=false
          terraform -chdir=infra apply -auto-approve -input=false

      - name: Publish assets
        run: |
          set -euo pipefail
          BUCKET=$(terraform -chdir=infra output -raw bucket_name)
          DIST=$(terraform -chdir=infra output -raw distribution_id)
          VERSION=$(cat VERSION)

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid asset version: $VERSION" >&2
            exit 1
          fi

          # Immutable release assets. A rerun is allowed only when every source
          # byte is identical to the original publication.
          EXISTING_COUNT=$(aws s3api list-objects-v2 \
            --bucket "$BUCKET" \
            --prefix "${VERSION}/" \
            --max-keys 1 \
            --query 'KeyCount' \
            --output text)
          if [ "$EXISTING_COUNT" = "0" ]; then
            aws s3 sync assets "s3://${BUCKET}/${VERSION}/" \
              --cache-control 'public,max-age=31536000,immutable'
            aws s3 cp ASSETS.sha256 "s3://${BUCKET}/${VERSION}/.manifest.sha256" \
              --cache-control 'public,max-age=31536000,immutable'
          else
            aws s3 cp "s3://${BUCKET}/${VERSION}/.manifest.sha256" \
              /tmp/published-assets.sha256
            if ! cmp --silent ASSETS.sha256 /tmp/published-assets.sha256; then
              echo "Refusing to change immutable assets for ${VERSION}." >&2
              exit 1
            fi
          fi

          if [[ "$VERSION" != *-* ]]; then
            # Stable aliases for manually linked assets and backwards
            # compatibility. Sync only the prefixes this publisher owns, so
            # historical releases and unrelated publishers can never be deleted.
            for ASSET_DIR in assets/*/; do
              ASSET_PREFIX=$(basename "$ASSET_DIR")
              case "$ASSET_PREFIX" in
                logos|v*)
                  echo "Reserved asset prefix: $ASSET_PREFIX" >&2
                  exit 1 ;;
              esac
              aws s3 sync "$ASSET_DIR" "s3://${BUCKET}/${ASSET_PREFIX}/" \
                --delete \
                --cache-control 'public,max-age=3600,s-maxage=86400,stale-while-revalidate=604800'
            done

            mapfile -t INVALIDATION_PATHS < <(
              find assets -mindepth 1 -maxdepth 1 -type d -printf '/%f/*\n' | sort
            )
            aws cloudfront create-invalidation \
              --distribution-id "$DIST" \
              --paths "${INVALIDATION_PATHS[@]}"
          fi

      - name: Post deploy summary
        if: always()
        run: |
          ORIGIN=$(terraform -chdir=infra output -raw origin_hostname 2>/dev/null || true)
          echo "## Eufemia assets deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**CloudFront origin:** \`${ORIGIN}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Published version:** \`$(cat VERSION)\`" >> "$GITHUB_STEP_SUMMARY"
